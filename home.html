<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>给 葛成璐 的夜市</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#05070f;overflow:hidden}
  body{font-family:"Songti SC","STSong","Noto Serif SC",serif;color:#e8eefc;
       animation:pageIn .9s ease both}
  @keyframes pageIn{from{opacity:0}to{opacity:1}}

  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #box{position:relative;width:min(100vw, calc(100vh * 16 / 9));
       height:min(100vh, calc(100vw * 9 / 16))}
  #box > img{width:100%;height:100%;display:block;object-fit:contain}

  #head{position:absolute;left:0;right:0;top:0;padding:1.6vh 4vw 4.5vh;text-align:center;
        background:linear-gradient(180deg,rgba(4,7,16,.86),rgba(4,7,16,.40) 58%,rgba(4,7,16,0));
        pointer-events:none;z-index:3}
  #head .k{font-size:clamp(8px,.62vw,11px);letter-spacing:.55em;color:#93a5c8}
  #head h1{margin-top:.6vh;font-size:clamp(19px,2.9vw,40px);font-weight:500;letter-spacing:.14em;
        text-shadow:0 2px 18px rgba(0,0,0,.75);
        background:linear-gradient(180deg,#fff7e6,#f0cd92);-webkit-background-clip:text;
        background-clip:text;color:transparent}
  #head .s{margin-top:.5vh;font-size:clamp(9px,1.05vw,13px);letter-spacing:.2em;color:#a3b3d2;
        text-shadow:0 1px 10px rgba(0,0,0,.8)}

  .hot{position:absolute;display:block;border-radius:14px;
       outline:1px solid transparent;outline-offset:0;
       transition:outline-color .28s,background .28s,box-shadow .28s;z-index:2}
  .hot:hover,.hot:active{outline-color:rgba(255,206,150,.5);background:rgba(255,190,120,.07);
       box-shadow:0 0 40px rgba(255,180,100,.18) inset}
  .hot .tag{position:absolute;left:50%;bottom:3.5%;transform:translateX(-50%);
       white-space:nowrap;font-size:clamp(9px,1.12vw,14px);letter-spacing:.16em;
       padding:.5em 1em;border-radius:999px;color:#ffe9c4;
       background:rgba(8,12,24,.66);border:1px solid rgba(255,206,150,.26);
       backdrop-filter:blur(3px);
       box-shadow:0 4px 18px rgba(0,0,0,.45);
       transition:background .28s,border-color .28s,color .28s}
  .hot:hover .tag{background:rgba(38,24,12,.88);border-color:rgba(255,214,160,.72);color:#fff4dc}
  .hot .tag i{font-style:normal;opacity:.55;padding:0 .3em}
  .hot.soon .tag{color:#b9c3d6;border-color:rgba(160,180,220,.22);background:rgba(8,12,24,.5)}

  #hint{display:none;margin-top:1.2vh;font-size:clamp(10px,2.9vw,13px);
        letter-spacing:.14em;color:#f0cd92;opacity:.85;
        text-shadow:0 1px 10px rgba(0,0,0,.8)}

  #list{display:none;position:absolute;left:0;right:0;bottom:0;z-index:4;
        padding:0 0 6.5vh;flex-direction:column;align-items:center;gap:2vh}
  #list a,#list div{width:min(72vw,340px);text-align:center;text-decoration:none;
        font-size:clamp(13px,3.9vw,17px);letter-spacing:.18em;color:#ffe9c4;
        padding:1.05em 0;border-radius:999px;background:rgba(10,14,26,.66);
        border:1px solid rgba(255,206,150,.28);backdrop-filter:blur(6px);
        box-shadow:0 6px 22px rgba(0,0,0,.42)}
  #list a:active{background:rgba(38,24,12,.9);border-color:rgba(255,214,160,.72)}
  #list div{color:#a9b4c8;border-color:rgba(160,180,220,.2)}

  @media (orientation: portrait){
    #box{width:100vw;height:100vh}
    #box > img{object-fit:cover;object-position:center 46%}
    .hot{display:none}
    #list{display:flex}
    #head{padding-top:3.4vh}
    #hint{display:block}
  }

  #music{position:fixed;right:max(14px,3vw);top:max(14px,3vh);width:42px;height:42px;
        border-radius:50%;display:none;align-items:center;justify-content:center;
        background:rgba(10,14,26,.6);border:1px solid rgba(255,206,150,.35);
        color:#ffdca8;font-size:17px;line-height:1;cursor:pointer;z-index:6;
        font-family:serif;-webkit-tap-highlight-color:transparent;
        transition:background .3s,border-color .3s,opacity .3s,transform .2s}
  #music:hover{background:rgba(30,20,10,.8);border-color:rgba(255,214,160,.7)}
  #music.on{display:flex}
  #music.hint{display:flex;width:auto;padding:0 15px;border-radius:999px;
        font-size:12px;letter-spacing:.12em;gap:4px;
        animation:pulse 2.4s ease-in-out infinite}
  #music.muted{opacity:.45}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,206,150,.4)}
                   50%{box-shadow:0 0 0 13px rgba(255,206,150,0)}}

  #fade{position:fixed;inset:0;background:#05070f;opacity:0;pointer-events:none;
        transition:opacity .4s;z-index:9}
  #fade.on{opacity:1}
</style>
</head>
<body>
<div id="wrap"><div id="box">
  <img src="img/scene.jpg" alt="夜市">

  <a class="hot" href="wish.html"  style="left:0.5%;top:71%;width:22%;height:23%">
    <span class="tag">许愿池<i>·</i>扔一枚硬币</span>
  </a>
  <a class="hot" href="letter.html" style="left:82%;top:57%;width:17.5%;height:39%">
    <span class="tag">写给你的信</span>
  </a>
  <a class="hot" href="game.html"  style="left:15%;top:34%;width:27%;height:32%">
    <span class="tag">星星小游戏</span>
  </a>
  <div class="hot soon" style="left:67%;top:3%;width:22%;height:52%">
    <span class="tag">还在布置</span>
  </div>

  <nav id="list">
    <a href="wish.html">许 愿 池</a>
    <a href="letter.html">写 给 你 的 信</a>
    <a href="game.html">星 星 小 游 戏</a>
    <div>还 在 布 置</div>
  </nav>

  <div id="head">
    <p class="k">HAPPY BIRTHDAY</p>
    <h1>葛成璐，生日快乐</h1>
    <p class="s">今晚这条街，是给你一个人开的</p>
    <p id="hint">↻ 横过来看，整条街都在</p>
  </div>
</div></div>
<button id="music" title="音乐">♪</button>
<audio id="bgm" src="bgm/me-you-128.mp3" loop preload="none"></audio>
<div id="fade"></div>
<script>
(function(){
  var bgm = document.getElementById("bgm");
  var mbtn = document.getElementById("music");
  var inFrame = false;
  try { inFrame = (window.self !== window.top); } catch (e) { inFrame = true; }

  if (inFrame){
    /* 被开场页用 iframe 嵌进来时，音乐由外层统一播放，这里不重复放 */
    if (bgm && bgm.parentNode){ bgm.preload = "none"; bgm.removeAttribute("src"); bgm.parentNode.removeChild(bgm); }
    if (mbtn && mbtn.parentNode) mbtn.parentNode.removeChild(mbtn);
  } else {
    var playing = false, rampTimer = null;
    bgm.preload = "auto";
    try { bgm.load(); } catch (e) {}

    var ramp = function(to, ms){
      if (rampTimer) clearInterval(rampTimer);
      var from = bgm.volume, steps = Math.max(1, Math.round(ms / 50)), i = 0;
      rampTimer = setInterval(function(){
        i++;
        bgm.volume = Math.min(1, Math.max(0, from + (to - from) * (i / steps)));
        if (i >= steps){ clearInterval(rampTimer); rampTimer = null; bgm.volume = to; }
      }, 50);
    };
    var started = function(){ playing = true; mbtn.className = "on"; mbtn.title = "点击暂停音乐"; mbtn.textContent = "♪"; };
    var blocked = function(){ playing = false; mbtn.className = "hint"; mbtn.title = "点一下播放音乐"; mbtn.textContent = "♪ 播放音乐"; };
    var startBgm = function(){
      bgm.volume = 0;
      var p = bgm.play();
      if (p && p.then){
        p.then(function(){ started(); ramp(0.4, 2200); }).catch(blocked);
      } else { started(); ramp(0.4, 2200); }
    };
    startBgm();

    mbtn.addEventListener("click", function(){
      if (playing){
        bgm.pause(); playing = false; mbtn.className = "on muted"; mbtn.title = "点击播放音乐";
      } else {
        bgm.volume = 0;
        var p = bgm.play();
        if (p && p.then){
          p.then(function(){ started(); ramp(0.4, 900); }).catch(blocked);
        } else { started(); ramp(0.4, 900); }
      }
    });
  }

  var links = document.querySelectorAll("a.hot, #list a");
  for (var i = 0; i < links.length; i++){
    (function(a){
      a.addEventListener("click", function(e){
        e.preventDefault();
        document.getElementById("fade").classList.add("on");
        if (!inFrame && typeof ramp === "function") ramp(0, 260);
        setTimeout(function(){ location.href = a.getAttribute("href"); }, 380);
      });
    })(links[i]);
  }

  /* 鼠标移到小游戏上就把曲子先拉下来，点开不卡 */
  (function(){
    var gl = null, all = document.querySelectorAll('a[href="game.html"]');
    for (var k = 0; k < all.length; k++){ (function(el){ if (gl) return; gl = el; })(all[k]); }
    if (!gl) return;
    var warm = false;
    gl.addEventListener("mouseenter", function(){
      if (warm) return;
      warm = true;
      try { var w = new Audio(); w.preload = "auto"; w.src = "bgm/fangcaodi.mp3?v=2"; } catch (e) {}
    });
  })();
})();
</script>
</body>
</html>
