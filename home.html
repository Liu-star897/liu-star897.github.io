<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>葛成璐 · 夜市</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#05080f}
  body{font-family:"Songti SC","STSong","Noto Serif SC",serif;color:#e8eefc;
       -webkit-font-smoothing:antialiased}
  #sky{position:fixed;inset:0;width:100%;height:100%;display:block}
  #stage{position:relative;height:100%;display:flex;flex-direction:column;
         align-items:center;justify-content:center;padding:2vh 4vw 3vh}
  header{text-align:center;margin-bottom:1.5vh;flex:0 0 auto}
  .k{font-size:clamp(9px,.9vw,11px);letter-spacing:.42em;color:#7e8db0;
     text-transform:uppercase;margin-bottom:1.4vh}
  h1{font-size:clamp(26px,4.4vw,46px);font-weight:500;letter-spacing:.10em;
     background:linear-gradient(180deg,#fff6e2 8%,#f6d9a4 52%,#dfae67 100%);
     -webkit-background-clip:text;background-clip:text;color:transparent;
     filter:drop-shadow(0 0 26px rgba(255,196,120,.20))}
  .sub{margin-top:1.1vh;font-size:clamp(11px,1.15vw,14px);letter-spacing:.16em;color:#95a3c2}

  #plaza{position:relative;width:min(94vw,72vh);aspect-ratio:1/1;flex:0 1 auto;
         margin-top:1vh}
  .floor{position:absolute;inset:6%;border-radius:50%;
    background:
      radial-gradient(circle at 50% 46%, rgba(255,198,124,.22) 0%, rgba(255,164,86,.09) 34%, rgba(12,18,32,0) 66%),
      radial-gradient(circle at 50% 50%, rgba(34,28,34,.92) 0%, rgba(16,18,30,.95) 70%, rgba(8,12,22,.98) 100%);
    box-shadow:inset 0 0 80px rgba(0,0,0,.75), 0 0 120px rgba(255,170,90,.08);
    overflow:hidden}
  .floor::before{content:"";position:absolute;inset:0;border-radius:50%;
    background-image:repeating-linear-gradient(0deg,rgba(255,206,150,.07) 0 1px,transparent 1px 34px),
                     repeating-linear-gradient(90deg,rgba(255,206,150,.055) 0 1px,transparent 1px 34px);
    -webkit-mask:radial-gradient(circle,#000 40%,transparent 74%);
            mask:radial-gradient(circle,#000 40%,transparent 74%)}
  .rim{position:absolute;inset:6%;border-radius:50%;
       border:1px dashed rgba(255,206,150,.10);pointer-events:none}
  .rim2{position:absolute;inset:18%;border-radius:50%;
        border:1px solid rgba(255,206,150,.05);pointer-events:none}

  /* 中间蛋糕 */
  .cake{position:absolute;left:50%;top:47%;width:34%;transform:translate(-50%,-50%);
        pointer-events:none;filter:drop-shadow(0 0 34px rgba(255,180,96,.28))}
  .cake svg{width:100%;height:auto;display:block}

  /* 四个摊子 */
  .spot{position:absolute;display:flex;flex-direction:column;align-items:center;gap:.7vh;
        width:clamp(74px,10.5vw,120px);text-decoration:none;color:inherit;
        transition:transform .32s cubic-bezier(.2,.8,.3,1),opacity .3s}
  .spot .stall{position:relative;width:100%;display:flex;flex-direction:column;align-items:center;
    transition:transform .32s cubic-bezier(.2,.8,.3,1)}
  .spot .awning{position:relative;width:104%;height:clamp(13px,2vh,22px);
    margin-bottom:-16px;z-index:2;
    border-radius:100% 100% 3px 3px / 100% 100% 14% 14%;
    background:repeating-linear-gradient(90deg,#f3c98d 0 12.5%,#8c4a2c 12.5% 25%);
    box-shadow:0 4px 20px rgba(255,150,70,.30), inset 0 -2px 7px rgba(0,0,0,.28);}
  .spot .awning::after{content:"";position:absolute;inset:0;border-radius:inherit;
    background:linear-gradient(180deg,rgba(255,244,222,.38),rgba(255,180,110,0) 62%)}
  .spot .badge{position:relative;width:86%;aspect-ratio:1/1;border-radius:50%;
    background:radial-gradient(circle at 50% 38%, rgba(255,214,160,.18), rgba(22,26,44,.94) 64%, rgba(12,16,28,.97));
    border:1px solid rgba(255,206,150,.24);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 30px rgba(255,178,96,.14), inset 0 0 24px rgba(255,180,96,.07);
    transition:border-color .3s,box-shadow .3s}
  .spot .badge::after{content:"";position:absolute;inset:-10px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,190,110,.22),transparent 68%);
    opacity:0;transition:opacity .32s}
  .spot svg{width:36%;height:36%;stroke:#ffd9a4;fill:none;stroke-width:1.5;
            stroke-linecap:round;stroke-linejoin:round}
  .spot .t{font-size:clamp(11px,1.25vw,15px);letter-spacing:.14em;color:#dce6fb;
           white-space:nowrap}
  .spot .s{font-size:clamp(9px,.85vw,11px);letter-spacing:.10em;color:#7d8bab;
           margin-top:-.35vh;white-space:nowrap}
  .spot:hover .stall{transform:translateY(-4px)}
  .spot:hover .badge{border-color:rgba(255,214,160,.68);
    box-shadow:0 0 46px rgba(255,178,96,.36), inset 0 0 28px rgba(255,190,120,.16)}
  .spot:hover .badge::after{opacity:1}
  .spot.soon{opacity:.42;cursor:default;filter:saturate(.5)}
  .spot.soon:hover{transform:none}
  .spot.soon:hover .badge{border-color:rgba(255,206,150,.22);
    box-shadow:0 0 26px rgba(255,178,96,.10), inset 0 0 22px rgba(255,180,96,.06)}

  .s-top{left:50%;top:0;transform:translateX(-50%)}
  .s-right{right:0;top:50%;transform:translateY(-50%)}
  .s-bottom{left:50%;bottom:0;transform:translateX(-50%)}
  .s-left{left:0;top:50%;transform:translateY(-50%)}
  .s-top:hover{transform:translateX(-50%) scale(1.05)}
  .s-right:hover{transform:translateY(-50%) scale(1.05)}
  .s-bottom:hover{transform:translateX(-50%) scale(1.05)}
  .s-left:hover{transform:translateY(-50%) scale(1.05)}

  footer{margin-top:2vh;font-size:clamp(9px,.9vw,11px);letter-spacing:.26em;
         color:#63708c;text-align:center;flex:0 0 auto}

  #fade{position:fixed;inset:0;background:#05080f;opacity:0;pointer-events:none;
        transition:opacity .42s ease;z-index:20}
  #fade.on{opacity:1}
  body{animation:pageIn .9s ease both}
  @keyframes pageIn{from{opacity:0}to{opacity:1}}

  #strings{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
  #wire{position:absolute;inset:0;width:100%;height:100%}
  .bulb{position:absolute;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;
    background:#ffe9c2;box-shadow:0 0 9px 3px rgba(255,186,96,.5),0 0 24px 6px rgba(255,164,80,.18);
    animation:tw 3.6s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.5}50%{opacity:1}}

  @media (max-height:640px){
    h1{font-size:clamp(22px,3.6vw,32px)}
    .sub{display:none}
    .cake{width:30%}
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>

<div id="stage">
  <header>
    <p class="k">Happy Birthday</p>
    <h1>葛成璐，生日快乐</h1>
    <p class="sub">今晚这条街，是给你一个人开的</p>
  </header>

  <div id="plaza">
    <div class="floor"></div>
    <div class="rim"></div>
    <div class="rim2"></div>

    <div class="cake">
      <svg viewBox="0 0 120 140" aria-hidden="true">
        <defs>
          <linearGradient id="cs" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffeeda"/><stop offset="1" stop-color="#dbae84"/>
          </linearGradient>
          <linearGradient id="ct" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#f2d4b0"/>
          </linearGradient>
          <radialGradient id="glow">
            <stop offset="0" stop-color="rgba(255,206,140,.42)"/>
            <stop offset="1" stop-color="rgba(255,180,100,0)"/>
          </radialGradient>
        </defs>
        <ellipse cx="60" cy="72" rx="58" ry="58" fill="url(#glow)"/>
        <ellipse cx="60" cy="126" rx="46" ry="8" fill="#0d1626" opacity=".8"/>
        <rect x="18" y="100" width="84" height="24" rx="4" fill="url(#cs)"/>
        <ellipse cx="60" cy="100" rx="42" ry="10" fill="url(#ct)"/>
        <rect x="28" y="78" width="64" height="22" rx="4" fill="url(#cs)"/>
        <ellipse cx="60" cy="78" rx="32" ry="8" fill="url(#ct)"/>
        <rect x="38" y="58" width="44" height="20" rx="4" fill="url(#cs)"/>
        <ellipse cx="60" cy="58" rx="22" ry="7" fill="url(#ct)"/>
        <rect x="51" y="38" width="3" height="20" rx="1.5" fill="#f6ead8"/>
        <rect x="65" y="40" width="3" height="18" rx="1.5" fill="#f6ead8"/>
        <rect x="58" y="33" width="3" height="25" rx="1.5" fill="#fff6e8"/>
        <ellipse cx="59.5" cy="31" rx="2.7" ry="4.4" fill="#ffd98c"/>
        <ellipse cx="66.5" cy="35" rx="2.1" ry="3.5" fill="#ffd27a"/>
        <ellipse cx="52.5" cy="33" rx="2.1" ry="3.5" fill="#ffd27a"/>
      </svg>
    </div>

    <a class="spot s-top" href="letter.html">
      <span class="stall">
        <span class="awning"></span>
        <span class="badge">
          <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3.5 7.5 12 13.5 20.5 7.5"/></svg>
        </span>
      </span>
      <span class="t">写给你的信</span>
      <span class="s">点开读一读</span>
    </a>

    <a class="spot s-right" href="wish.html">
      <span class="stall">
        <span class="awning"></span>
        <span class="badge">
          <svg viewBox="0 0 24 24"><path d="M12 3.5c3.6 4.2 6 7.3 6 10a6 6 0 0 1-12 0c0-2.7 2.4-5.8 6-10Z"/><path d="M9.5 14.2a2.8 2.8 0 0 0 2.6 2.5"/></svg>
        </span>
      </span>
      <span class="t">许愿池</span>
      <span class="s">扔一枚硬币</span>
    </a>

    <a class="spot s-bottom" href="game.html">
      <span class="stall">
        <span class="awning"></span>
        <span class="badge">
          <svg viewBox="0 0 24 24"><path d="M12 3.6l2.3 4.9 5.2.7-3.8 3.6.9 5.2-4.6-2.5-4.6 2.5.9-5.2L4.5 9.2l5.2-.7Z"/></svg>
        </span>
      </span>
      <span class="t">星星小游戏</span>
      <span class="s">通关有奖励</span>
    </a>

    <div class="spot s-left soon">
      <span class="stall">
        <span class="awning"></span>
        <span class="badge">
          <svg viewBox="0 0 24 24"><ellipse cx="12" cy="9" rx="5.4" ry="5.6"/><path d="M12 14.6V19M9.6 19h4.8"/></svg>
        </span>
      </span>
      <span class="t">还在布置</span>
      <span class="s">过几天开张</span>
    </div>
  </div>

  <footer>每个摊子都能点开看看</footer>
</div>

<div id="strings">
  <svg id="wire" preserveAspectRatio="none"></svg>
</div>

<div id="fade"></div>

<script>
(function(){
  /* 夜市灯串 */
  (function(){
    var wrap = document.getElementById("strings"), svg = document.getElementById("wire");
    var NS = "http://www.w3.org/2000/svg";
    var VBW = 1000, VBH = 600;
    svg.setAttribute("viewBox", "0 0 " + VBW + " " + VBH);
    var defs = document.createElementNS(NS, "defs");
    svg.appendChild(defs);

    var rows = [
      { y: 46, sag: 132, n: 19, d: 0 },
      { y: 176, sag: 116, n: 17, d: 900 },
      { y: 330, sag: 96, n: 15, d: 1800 }
    ];
    rows.forEach(function(row){
      var d = "M -40 " + row.y + " Q " + (VBW / 2) + " " + (row.y + row.sag * 2) + " " + (VBW + 40) + " " + row.y;
      var p = document.createElementNS(NS, "path");
      p.setAttribute("d", d);
      p.setAttribute("fill", "none");
      p.setAttribute("stroke", "rgba(255,222,178,.16)");
      p.setAttribute("stroke-width", "1.2");
      p.setAttribute("vector-effect", "non-scaling-stroke");
      svg.appendChild(p);

      for (var i = 0; i < row.n; i++){
        var t = (i + .5) / row.n;
        var x = -40 + (VBW + 80) * t;
        var y = row.y + row.sag * 2 * 2 * t * (1 - t);
        var b = document.createElement("span");
        b.className = "bulb";
        b.style.left = (x / VBW * 100) + "%";
        b.style.top = (y / VBH * 100) + "%";
        b.style.animationDelay = (-(row.d + i * 130) % 3600) + "ms";
        wrap.appendChild(b);
      }
    });
  })();

  var cv = document.getElementById("sky");
  var ctx = cv.getContext("2d");
  function draw(){
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    var W = cv.clientWidth, H = cv.clientHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#060b1a");
    g.addColorStop(.55, "#08101f");
    g.addColorStop(1, "#05080f");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    /* 远处一层暖光，像街市在天边 */
    var wg = ctx.createRadialGradient(W * .5, H * .72, 0, W * .5, H * .72, Math.max(W, H) * .55);
    wg.addColorStop(0, "rgba(255,176,96,.10)");
    wg.addColorStop(1, "rgba(255,176,96,0)");
    ctx.fillStyle = wg; ctx.fillRect(0, 0, W, H);

    var n = Math.min(420, Math.round(W * H / 2600));
    for (var i = 0; i < n; i++){
      var x = Math.random() * W, y = Math.random() * H * .82;
      var r = .3 + Math.pow(Math.random(), 3) * 1.3;
      var a = .16 + Math.random() * .5;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, 6.2832);
      ctx.fillStyle = "rgba(226,238,255," + a.toFixed(3) + ")";
      ctx.fill();
    }
    for (var k = 0; k < 14; k++){
      var bx = Math.random() * W, by = Math.random() * H * .7;
      var br = 1.5 + Math.random() * 1.6;
      var rg = ctx.createRadialGradient(bx, by, 0, bx, by, br * 7);
      rg.addColorStop(0, "rgba(226,238,255,.5)");
      rg.addColorStop(1, "rgba(226,238,255,0)");
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(bx, by, br * 7, 0, 6.2832); ctx.fill();
      ctx.beginPath(); ctx.arc(bx, by, br * .6, 0, 6.2832);
      ctx.fillStyle = "#f4f8ff"; ctx.fill();
    }
  }
  var t = 0;
  function onResize(){ if (t) clearTimeout(t); t = setTimeout(draw, 120); }
  window.addEventListener("resize", onResize);
  draw();

  var fade = document.getElementById("fade");
  Array.prototype.forEach.call(document.querySelectorAll("a.spot"), function(a){
    a.addEventListener("click", function(e){
      e.preventDefault();
      var href = a.getAttribute("href");
      fade.classList.add("on");
      setTimeout(function(){ location.href = href; }, 420);
    });
  });
})();
</script>
</body>
</html>
