<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>生日快乐</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="sky"></canvas>
<div class="wrap">

  <header class="hero">
    <p class="kicker">Happy Birthday</p>
    <h1>生日快乐</h1>
    <p class="sub">今天的主角，是你</p>
    <div class="line"></div>
  </header>

  <section class="entries">
    <a class="card" href="letter.html">
      <span class="num">01</span>
      <h2>写给你的信</h2>
      <p>有些话当面说会不好意思，所以写下来。</p>
      <span class="go">打开 <span>→</span></span>
    </a>
    <a class="card" href="gallery.html">
      <span class="num">02</span>
      <h2>那年今天</h2>
      <p>一些攒了很久的照片，和照片背后的故事。</p>
      <span class="go">打开 <span>→</span></span>
    </a>
    <a class="card" href="story.html">
      <span class="num">03</span>
      <h2>我们的时间线</h2>
      <p>从第一次说话那天起，一直到这里。</p>
      <span class="go">打开 <span>→</span></span>
    </a>
    <a class="card" href="wish.html">
      <span class="num">04</span>
      <h2>许个愿</h2>
      <p>吹蜡烛之前，先想一个不告诉别人的愿望。</p>
      <span class="go">打开 <span>→</span></span>
    </a>
  </section>

  <footer>MADE JUST FOR YOU</footer>
</div>

<script>
(function(){
  var c = document.getElementById('sky'), x = c.getContext('2d');
  var stars = [], W = 0, H = 0, dpr = Math.min(devicePixelRatio || 1, 2);
  function resize(){
    W = c.width = innerWidth * dpr;
    H = c.height = innerHeight * dpr;
    c.style.width = innerWidth + 'px';
    c.style.height = innerHeight + 'px';
    stars = [];
    var n = Math.round((innerWidth * innerHeight) / 9000);
    for (var i = 0; i < n; i++){
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: (Math.random() * 1.3 + .3) * dpr,
        a: Math.random() * .6 + .15,
        s: Math.random() * .015 + .004
      });
    }
  }
  function draw(t){
    x.clearRect(0, 0, W, H);
    for (var i = 0; i < stars.length; i++){
      var s = stars[i];
      var al = s.a + Math.sin(t * s.s + i) * .22;
      x.beginPath();
      x.arc(s.x, s.y, s.r, 0, 6.2832);
      x.fillStyle = 'rgba(240,214,170,' + Math.max(0, al) + ')';
      x.fill();
    }
    requestAnimationFrame(draw);
  }
  addEventListener('resize', resize);
  resize();
  requestAnimationFrame(draw);

  // 卡片跟随鼠标的高光
  document.querySelectorAll('.card').forEach(function(el){
    el.addEventListener('pointermove', function(e){
      var r = el.getBoundingClientRect();
      el.style.setProperty('--mx', (e.clientX - r.left) + 'px');
      el.style.setProperty('--my', (e.clientY - r.top) + 'px');
    });
  });
})();
</script>
</body>
</html>
