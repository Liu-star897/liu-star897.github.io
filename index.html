<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>给 小鹿 的流星雨</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='24' font-size='24'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#000206}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#e8eaf2;-webkit-font-smoothing:antialiased}
#cv{position:fixed;inset:0;display:block;width:100%;height:100%}

/* ---------- 输入 ---------- */
#gate{
  position:fixed;inset:0;z-index:6;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;
  transition:opacity .9s ease,transform .9s ease;
}
#gate.gone{opacity:0;transform:scale(1.05);pointer-events:none}
.hint{font-size:12px;letter-spacing:.34em;color:#6f7b9c;margin-bottom:36px}
.field{position:relative;width:min(320px,80vw)}
#dob{
  width:100%;background:transparent;border:0;border-bottom:1px solid rgba(214,228,255,.22);
  color:#dce6ff;font-size:25px;letter-spacing:.16em;text-align:center;
  padding:12px 4px;outline:none;font-family:inherit;
  transition:border-color .45s,box-shadow .45s;
}
#dob::placeholder{color:#2f3752;letter-spacing:.14em;font-size:20px}
#dob:focus{border-color:rgba(214,228,255,.6);box-shadow:0 14px 44px -20px rgba(150,190,255,.55)}
#go{
  margin-top:38px;padding:11px 34px;border-radius:999px;cursor:pointer;
  background:transparent;border:1px solid rgba(214,228,255,.22);
  color:#c9d5ee;font-size:12px;letter-spacing:.3em;font-family:inherit;
  transition:.4s;
}
#go:hover{border-color:rgba(214,228,255,.55);background:rgba(214,228,255,.05)}
#err{height:20px;margin-top:16px;font-size:11px;color:#b06b6b;letter-spacing:.12em;opacity:0;transition:.35s}
#err.show{opacity:1}
.shake{animation:shake .45s}
@keyframes shake{
  0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}
  40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}
}
.forgot{margin-top:46px;font-size:11px;color:#2c3348;letter-spacing:.1em}
.forgot a{color:#4e5875;cursor:pointer;text-decoration:underline;text-underline-offset:4px}

/* ---------- 标题卡 ---------- */
#card{
  position:fixed;inset:0;z-index:4;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;
  opacity:0;pointer-events:none;
  transition:opacity 1.2s ease;
}
#card.on{opacity:1;pointer-events:none;transform:none}
#card.on #next{pointer-events:auto}
#card h1{
  font-family:"Songti SC","Noto Serif SC","STSong",Georgia,serif;
  font-weight:400;font-size:clamp(24px,5.8vw,54px);letter-spacing:.15em;
  color:#eaf1ff;margin-bottom:30px;
  text-shadow:0 0 60px rgba(130,175,255,.32);
}
#card .t1{font-size:clamp(13px,2.1vw,17px);letter-spacing:.12em;color:#c3d0ea;margin-bottom:14px}
#card .t2{font-size:clamp(12px,1.9vw,15px);letter-spacing:.12em;color:#9fb0cf;margin-bottom:44px}
#next{
  padding:12px 40px;border-radius:999px;cursor:pointer;font-family:inherit;
  background:transparent;border:1px solid rgba(214,228,255,.28);
  color:#dbe5f8;font-size:12px;letter-spacing:.3em;transition:.4s;
}
#next:hover{border-color:rgba(214,228,255,.65);background:rgba(214,228,255,.06);box-shadow:0 0 40px -12px rgba(150,190,255,.5)}
#card .tip{margin-top:18px;font-size:10px;letter-spacing:.24em;color:#3a4258}

/* 标题卡三段递进 */
#card .c1,#card .c2,#card .c3,#card .c4{
  opacity:0;transform:translateY(14px);
  transition:opacity 2s cubic-bezier(.22,.61,.36,1),transform 2s cubic-bezier(.22,.61,.36,1);
}
#card.st1 .c1{opacity:1;transform:none}
#card.st2 .c2{opacity:1;transform:none}
#card.st3 .c3,#card.st3 .c4{opacity:1;transform:none}

/* ---------- 结尾 ---------- */
#final{
  position:fixed;inset:0;z-index:5;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding-bottom:13vh;
  opacity:0;transition:opacity 1.8s ease;
}
#final.on{opacity:1}
#final .sub{font-size:12px;letter-spacing:.42em;color:#8fa0c2;margin-bottom:12px}
#final .sub2{font-size:10px;letter-spacing:.3em;color:#4d5776}

#fade{position:fixed;inset:0;z-index:9;background:#000206;opacity:0;pointer-events:none;transition:opacity 1.9s ease}
#fade.on{opacity:1}
#skip{
  position:fixed;right:22px;bottom:20px;z-index:8;display:none;
  font-size:11px;letter-spacing:.22em;color:#39415a;cursor:pointer;padding:8px;
  transition:color .3s;
}
#skip:hover{color:#7d88a8}

/* ---------- 点击开始 ---------- */
#tap{
  position:fixed;inset:0;z-index:7;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;cursor:pointer;
  background:radial-gradient(circle at 50% 42%,#0a1530 0%,#040b1c 46%,#000206 100%);
  transition:opacity .9s ease;
}
#tap.gone{opacity:0;pointer-events:none}
.tap-t{
  font-family:"Songti SC","Noto Serif SC","STSong",Georgia,serif;
  font-weight:400;font-size:clamp(19px,4.4vw,34px);letter-spacing:.2em;
  color:#e8f0ff;margin-bottom:42px;text-shadow:0 0 50px rgba(130,175,255,.3);
}
.tap-b{
  padding:12px 44px;border-radius:999px;border:1px solid rgba(214,228,255,.3);
  color:#dbe5f8;font-size:12px;letter-spacing:.34em;transition:.4s;
}
#tap:hover .tap-b{border-color:rgba(214,228,255,.7);background:rgba(214,228,255,.07)}
.tap-s{margin-top:26px;font-size:10px;letter-spacing:.26em;color:#3f475e}

/* ---------- 可点的星 ---------- */
#stars{position:fixed;inset:0;z-index:3;pointer-events:none}
.wstar{
  position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;
  pointer-events:auto;cursor:pointer;
  opacity:0;transform:scale(.6);
  transition:opacity 1.6s ease, transform .9s cubic-bezier(.22,.61,.36,1);
}
.wstar.show{opacity:1;transform:scale(1)}
.wstar:hover{transform:scale(1.3)}
.wstar::before{
  content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.85) 0%,rgba(200,226,255,.36) 17%,rgba(150,190,255,.09) 40%,rgba(150,190,255,0) 68%);
  animation:tw 3.8s ease-in-out infinite;
}
.wstar::after{
  content:"";position:absolute;left:50%;top:50%;width:2.5px;height:2.5px;margin:-1.25px 0 0 -1.25px;
  border-radius:50%;background:#fff;
  box-shadow:0 0 12px 3px rgba(208,230,255,.6);
}
@keyframes tw{0%,100%{opacity:.5}50%{opacity:1}}

/* ---------- 祝福卡 ---------- */
#wish{
  position:fixed;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;
  padding:24px;background:rgba(1,4,12,.55);
  opacity:0;pointer-events:none;transition:opacity .55s ease;
}
#wish.on{opacity:1;pointer-events:auto}
.wish-card{
  width:min(520px,82vw);padding:44px 40px;border-radius:20px;
  background:rgba(6,11,24,.93);border:1px solid rgba(206,228,255,.18);
  box-shadow:0 34px 96px -34px rgba(80,130,220,.55);text-align:center;
  transform:translateY(10px) scale(.98);
  transition:transform .65s cubic-bezier(.22,.61,.36,1);
  backdrop-filter:blur(8px);
}
#wish.on .wish-card{transform:none}
#wish-text{font-size:clamp(15px,2.1vw,19px);line-height:2.05;letter-spacing:.05em;color:#e8f0ff}
.wish-tip{margin-top:24px;font-size:10px;letter-spacing:.26em;color:#485272}

/* ---------- 音乐 ---------- */
#music{
  position:fixed;right:22px;top:20px;z-index:8;width:42px;height:42px;border-radius:50%;
  display:none;align-items:center;justify-content:center;cursor:pointer;
  border:1px solid rgba(214,228,255,.18);background:rgba(10,18,36,.35);
  color:#8fa0c2;font-size:15px;line-height:1;font-family:inherit;
  backdrop-filter:blur(4px);transition:.45s;
}
#music:not(.on){animation:musicHint 3.4s ease-in-out infinite}
@keyframes musicHint{0%,100%{opacity:.5}50%{opacity:1}}
#music:hover{border-color:rgba(214,228,255,.5);color:#dbe5f8}
#music.on{color:#ffe6c2;border-color:rgba(255,220,170,.45);box-shadow:0 0 26px -8px rgba(255,215,160,.6)}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="tap">
  <p class="tap-t">给 小 鹿 的 流 星 雨</p>
  <div class="tap-b">点 击 开 始</div>
  <p class="tap-s">建 议 戴 上 耳 机</p>
</div>

<div id="gate">
  <p class="hint">请 输 入 一 个 日 期</p>
  <div class="field">
    <input id="dob" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="YYYY-MM-DD" maxlength="10">
  </div>
  <button id="go">进 入</button>
  <p id="err">再想想，不是这个日子</p>
  <p class="forgot">想不起来了？<a id="tip">给你一点提示</a></p>
</div>

<div id="card">
  <h1 class="c1">给 小 鹿 的 流 星 雨</h1>
  <p class="t1 c2">愿你的十九岁，像这一刻流星一样闪耀。</p>
  <p class="t2 c3">好事追着你，幸运围着你。</p>
  <button id="next" class="c4">继 续</button>
  <p class="tip c4">点 击 看 下 一 页</p>
</div>

<div id="final">
  <p class="sub" id="sub1"></p>
  <p class="sub2" id="sub2"></p>
</div>

<div id="stars">
  <span class="wstar" data-i="0" style="left:8%;top:13%"></span>
  <span class="wstar" data-i="1" style="left:38%;top:7%"></span>
  <span class="wstar" data-i="2" style="left:90%;top:16%"></span>
  <span class="wstar" data-i="3" style="left:66%;top:29%"></span>
  <span class="wstar" data-i="4" style="left:17%;top:72%"></span>
  <span class="wstar" data-i="5" style="left:88%;top:76%"></span>
</div>

<div id="wish">
  <div class="wish-card">
    <p id="wish-text"></p>
    <p class="wish-tip">点空白处关掉</p>
  </div>
</div>

<div id="fade"></div>
<div id="skip">跳 过 →</div>
<div id="music">♪</div>
<audio id="bgm" src="bgm/9-teen.mp3" preload="auto" loop playsinline></audio>

<script>
var CONFIG = {
  needCode: false,
  answer: "20071206",
  sub1: "2007.12.06",
  sub2: "生 日 快 乐 · 第 十 九 个 冬 天",
  home: "home.html",
  wishes: [
    "生日快乐，葛成璐。",
    "愿你所求皆有回应，所行皆有归处。",
    "这一年累了就停一停，没人催你。",
    "好事会一件一件追上你的。",
    "每一个认识你的人，都认为这是一件幸运的事。",
    "十九岁的冬天，也要天天开心。"
  ],
  WARP: 1.6,
  RAIN: 5.8,
  BURST: 6.6
};

(function(){
  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d", { alpha: false });
  var W = 0, H = 0, DPR = 1;
  var bgCv = null;

  var twinkle = [], warp = [], meteors = [], parts = [], trails = [];
  var phase = "init", tPhase = 0, lastMs = 0;
  var spawnAcc = 0;

  var RAD = Math.PI * 0.655;

  /* ---------- 尺寸与静态背景 ---------- */
  function resize(){
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildBG();
    buildTwinkle();
  }

  function buildBG(){
    bgCv = document.createElement("canvas");
    bgCv.width = cv.width; bgCv.height = cv.height;
    var b = bgCv.getContext("2d");
    b.setTransform(DPR, 0, 0, DPR, 0, 0);

    var g = b.createRadialGradient(W * 0.52, H * 0.38, 0, W * 0.52, H * 0.38, Math.max(W, H) * 1.08);
    g.addColorStop(0, "#0a1530");
    g.addColorStop(0.42, "#040b1c");
    g.addColorStop(1, "#000206");
    b.fillStyle = g;
    b.fillRect(0, 0, W, H);

    /* 星云斑 */
    for (var k = 0; k < 3; k++){
      var nx = W * (0.2 + Math.random() * 0.6);
      var ny = H * (0.1 + Math.random() * 0.5);
      var nr = Math.max(W, H) * (0.18 + Math.random() * 0.22);
      var ng = b.createRadialGradient(nx, ny, 0, nx, ny, nr);
      ng.addColorStop(0, "rgba(70,96,180,0.055)");
      ng.addColorStop(0.55, "rgba(50,70,150,0.022)");
      ng.addColorStop(1, "rgba(20,30,80,0)");
      b.fillStyle = ng;
      b.fillRect(0, 0, W, H);
    }

    b.globalCompositeOperation = "lighter";

    /* 银河带 */
    var ax = W * 0.08, ay = -H * 0.08, bx = W * 1.02, by = H * 1.08;
    var ang = Math.atan2(by - ay, bx - ax);
    var px = Math.cos(ang + Math.PI / 2), py = Math.sin(ang + Math.PI / 2);
    var n = Math.min(1500, Math.round(W * H / 900));
    for (var i = 0; i < n; i++){
      var t = Math.random();
      var ox = (Math.random() + Math.random() + Math.random() + Math.random() - 2);
      var spread = 42 + Math.random() * 136;
      var x = ax + (bx - ax) * t + px * ox * spread + (Math.random() - .5) * 26;
      var y = ay + (by - ay) * t + py * ox * spread + (Math.random() - .5) * 26;
      var a = 0.014 + Math.random() * 0.07;
      b.beginPath();
      b.arc(x, y, 0.25 + Math.random() * 0.85, 0, 6.2832);
      b.fillStyle = "rgba(176,202,255," + a.toFixed(4) + ")";
      b.fill();
    }

    /* 远景星 */
    var ns = Math.min(420, Math.round(W * H / 3400));
    for (var j = 0; j < ns; j++){
      var sx = Math.random() * W, sy = Math.random() * H;
      var sr = 0.25 + Math.random() * 0.85;
      var sa = 0.05 + Math.random() * 0.3;
      b.beginPath();
      b.arc(sx, sy, sr, 0, 6.2832);
      b.fillStyle = "rgba(206,222,255," + sa.toFixed(3) + ")";
      b.fill();
    }
    b.globalCompositeOperation = "source-over";
  }

  function buildTwinkle(){
    twinkle = [];
    var n = Math.min(90, Math.round(W * H / 14000));
    for (var i = 0; i < n; i++){
      twinkle.push({
        x: Math.random() * W, y: Math.random() * H,
        r: 0.5 + Math.random() * 1.15,
        a: 0.2 + Math.random() * 0.5,
        s: 0.5 + Math.random() * 1.4,
        p: Math.random() * 6.2832
      });
    }
  }

  /* ---------- 文字取样 ---------- */
  function textPoints(lines, gap){
    var off = document.createElement("canvas");
    off.width = W; off.height = H;
    var o = off.getContext("2d");
    o.fillStyle = "#fff";
    o.textAlign = "center";
    o.textBaseline = "middle";
    for (var i = 0; i < lines.length; i++){
      var ln = lines[i];
      o.font = "400 " + ln.size + 'px "Songti SC","Noto Serif SC","STSong",Georgia,serif';
      o.fillText(ln.text, W / 2, H / 2 + ln.dy);
    }
    var data = o.getImageData(0, 0, W, H).data;
    var pts = [];
    for (var y = 0; y < H; y += gap){
      for (var x = 0; x < W; x += gap){
        if (data[(y * W + x) * 4 + 3] > 128) pts.push({ x: x, y: y });
      }
    }
    return pts;
  }

  /* ---------- 穿越 ---------- */
  function buildWarp(){
    warp = [];
    for (var i = 0; i < 340; i++){
      warp.push({
        a: Math.random() * 6.2832,
        r: Math.random() * Math.max(W, H) * 0.62 + 6,
        sp: 0.45 + Math.random() * 0.9,
        w: 0.5 + Math.random() * 1.1,
        al: 0.3 + Math.random() * 0.55
      });
    }
  }

  function drawWarp(dt, p){
    var cx = W * 0.5, cy = H * 0.46;
    var boost = 1 + Math.pow(p, 1.7) * 26;
    var lim = Math.max(W, H) * 1.25;
    var fade = p < 0.82 ? 1 : Math.max(0, (1 - p) / 0.18);
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.lineCap = "round";
    for (var i = 0; i < warp.length; i++){
      var s = warp[i];
      var pr = s.r;
      s.r += (s.r * 0.10 + 1.4) * s.sp * boost * dt;
      if (s.r > lim){ s.r = Math.random() * 16 + 3; pr = s.r; }
      var cos = Math.cos(s.a), sin = Math.sin(s.a);
      var x = cx + cos * s.r * 1.45, y = cy + sin * s.r;
      var px = cx + cos * pr * 1.45, py = cy + sin * pr;
      var len = Math.hypot(x - px, y - py);
      var a = Math.min(1, (s.r / 150)) * s.al * fade;
      if (len < 2){
        ctx.fillStyle = "rgba(226,238,255," + (a * 0.9).toFixed(3) + ")";
        ctx.beginPath(); ctx.arc(x, y, s.w * 0.9, 0, 6.2832); ctx.fill();
        continue;
      }
      var g = ctx.createLinearGradient(px, py, x, y);
      g.addColorStop(0, "rgba(190,214,255,0)");
      g.addColorStop(0.7, "rgba(206,226,255," + (a * 0.55).toFixed(3) + ")");
      g.addColorStop(1, "rgba(238,246,255," + a.toFixed(3) + ")");
      ctx.strokeStyle = g;
      ctx.lineWidth = s.w;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(x, y); ctx.stroke();
    }
    ctx.restore();
  }

  /* ---------- 流星 ---------- */
  function spawnMeteor(){
    var big = Math.random() < 0.05;
    var ang = RAD + (Math.random() - 0.5) * (big ? 0.5 : 0.3);
    var sp = (big ? 780 : 430) + Math.random() * (big ? 600 : 560);
    var x, y;
    var r0 = Math.random();
    if (r0 < 0.30){
      x = Math.random() * W * 1.18 - W * 0.06;
      y = Math.random() * H * 0.92;
    } else if (r0 < 0.78){
      x = Math.random() * (W * 1.25) - W * 0.1;
      y = -30 - Math.random() * H * 0.8;
    } else {
      x = W + 30 + Math.random() * 190;
      y = Math.random() * H * 0.8 - 40;
    }
    var pick = Math.random();
    var col = pick < 0.6 ? [232, 242, 255] : pick < 0.85 ? [206, 232, 255] : [255, 234, 204];
    meteors.push({
      x: x, y: y,
      vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
      len: (big ? 250 : 96) + Math.random() * (big ? 210 : 170),
      w: (big ? 1.8 : 0.95) + Math.random() * (big ? 0.8 : 0.6),
      a: (big ? 0.95 : 0.64) + Math.random() * (big ? 0.05 : 0.22),
      life: 1,
      age: 0,
      dec: (big ? 0.38 : 0.55) + Math.random() * (big ? 0.25 : 0.4),
      big: big, c: col
    });
  }

  function drawMeteors(dt){
    for (var i = meteors.length - 1; i >= 0; i--){
      var m = meteors[i];
      m.x += m.vx * dt; m.y += m.vy * dt;
      m.life -= m.dec * dt;
      m.age += dt;
      if (m.life <= 0 || m.y > H + 360 || m.x < -420){
        if (m.life <= 0 && m.big) trails.push({ x: m.x, y: m.y, vx: m.vx, vy: m.vy, len: m.len, a: 0.12, c: m.c });
        meteors.splice(i, 1);
        continue;
      }
      var sp = Math.hypot(m.vx, m.vy) || 1;
      var ux = m.vx / sp, uy = m.vy / sp;
      var L = m.len * (0.42 + 0.58 * m.life);
      var tx = m.x - ux * L, ty = m.y - uy * L;
      var al = m.a * Math.min(1, m.life * 2.2) * Math.min(1, m.age / 0.18);
      var c = m.c;
      var g = ctx.createLinearGradient(m.x, m.y, tx, ty);
      g.addColorStop(0, "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + al.toFixed(3) + ")");
      g.addColorStop(0.10, "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + (al * 0.55).toFixed(3) + ")");
      g.addColorStop(0.42, "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + (al * 0.24).toFixed(3) + ")");
      g.addColorStop(1, "rgba(" + c[0] + "," + c[1] + "," + c[2] + ",0)");
      ctx.strokeStyle = g;
      ctx.lineWidth = m.w;
      ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(tx, ty); ctx.stroke();

      if (m.big){
        var hr = 10;
        var hg = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, hr);
        hg.addColorStop(0, "rgba(255,255,255," + (al * 0.85).toFixed(3) + ")");
        hg.addColorStop(0.35, "rgba(206,232,255," + (al * 0.22).toFixed(3) + ")");
        hg.addColorStop(1, "rgba(170,205,255,0)");
        ctx.fillStyle = hg;
        ctx.beginPath(); ctx.arc(m.x, m.y, hr, 0, 6.2832); ctx.fill();
      } else {
        ctx.fillStyle = "rgba(240,247,255," + (al * 0.8).toFixed(3) + ")";
        ctx.beginPath(); ctx.arc(m.x, m.y, Math.max(0.5, m.w * 0.7), 0, 6.2832); ctx.fill();
      }
    }

    for (var k = trails.length - 1; k >= 0; k--){
      var tr = trails[k];
      tr.a -= dt * 0.09;
      if (tr.a <= 0){ trails.splice(k, 1); continue; }
      var s2 = Math.hypot(tr.vx, tr.vy) || 1;
      var ex = tr.x - tr.vx / s2 * tr.len, ey = tr.y - tr.vy / s2 * tr.len;
      var tg = ctx.createLinearGradient(tr.x, tr.y, ex, ey);
      tg.addColorStop(0, "rgba(" + tr.c[0] + "," + tr.c[1] + "," + tr.c[2] + "," + tr.a.toFixed(3) + ")");
      tg.addColorStop(1, "rgba(" + tr.c[0] + "," + tr.c[1] + "," + tr.c[2] + ",0)");
      ctx.strokeStyle = tg;
      ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.moveTo(tr.x, tr.y); ctx.lineTo(ex, ey); ctx.stroke();
    }
  }

  function rainRate(p){
    var s = Math.sin(Math.PI * Math.pow(Math.min(1, p), 0.8));
    return 4 + 44 * s;
  }

  function stepRain(dt, p){
    spawnAcc += rainRate(p) * dt;
    var guard = 0;
    while (spawnAcc >= 1 && guard++ < 40){
      spawnAcc -= 1;
      if (meteors.length < 380) spawnMeteor();
    }
  }

  /* ---------- 点阵汇聚 ---------- */
  function beginBurst(){
    phase = "burst"; tPhase = 0;
    var w1 = Math.min(W * 0.105, H * 0.135, 112);
    var w2 = Math.min(W * 0.205, H * 0.26, 200);
    var lines = [
      { text: "生日快乐", size: w1, dy: -w2 * 0.60 },
      { text: "葛成璐", size: w2, dy: w2 * 0.47 }
    ];
    var gap = Math.max(3, Math.round(w2 / 50));
    var pts = textPoints(lines, gap);
    while (pts.length > 2400 && gap < 14){
      gap += 1;
      pts = textPoints(lines, gap);
    }

    if (!pts.length) pts = [{ x: W / 2, y: H / 2 }];
    for (var i = pts.length - 1; i > 0; i--){
      var k = Math.floor(Math.random() * (i + 1));
      var tmp = pts[i]; pts[i] = pts[k]; pts[k] = tmp;
    }
    var count = Math.min(pts.length, 2400);
    parts = [];
    for (var n = 0; n < count; n++){
      var edge = Math.random();
      var sx, sy;
      if (edge < 0.42){ sx = Math.random() * W; sy = -20 - Math.random() * 110; }
      else if (edge < 0.71){ sx = W + 20 + Math.random() * 110; sy = Math.random() * H; }
      else if (edge < 0.9){ sx = -20 - Math.random() * 110; sy = Math.random() * H; }
      else { sx = Math.random() * W; sy = H + 20 + Math.random() * 110; }
      parts.push({
        x: sx, y: sy, sx: sx, sy: sy,
        tx: pts[n].x, ty: pts[n].y,
        r: Math.random() * 1.25 + 0.45,
        d: Math.random() * 0.38
      });
    }
    if (navigator.vibrate) { try { navigator.vibrate(16); } catch (e) {} }
  }

  function easeOut(t){ return 1 - Math.pow(1 - t, 3); }

  /* ---------- 主循环 ---------- */
  function render(dt, now){
    ctx.drawImage(bgCv, 0, 0, W, H);

    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (var i = 0; i < twinkle.length; i++){
      var s = twinkle[i];
      var al = s.a * (0.45 + 0.55 * (0.5 + 0.5 * Math.sin(now * s.s + s.p)));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, 6.2832);
      ctx.fillStyle = "rgba(224,236,255," + al.toFixed(3) + ")";
      ctx.fill();
    }
    ctx.restore();

    if (phase === "warp"){
      var p = Math.min(1, tPhase / CONFIG.WARP);
      drawWarp(dt, p);
      if (p >= 1){ phase = "rain"; tPhase = 0; spawnAcc = 0; }
      return;
    }

    if (phase === "rain"){
      var p2 = Math.min(1, tPhase / CONFIG.RAIN);
      stepRain(dt, p2);
      drawMeteors(dt);
      if (p2 >= 1){
        phase = "card"; tPhase = 0;
        showCard();
        document.getElementById("skip").style.display = "block";
      }
      return;
    }

    if (phase === "card"){
      spawnAcc += 2.6 * dt;
      if (spawnAcc >= 1 && meteors.length < 110){ spawnAcc -= 1; spawnMeteor(); }
      drawMeteors(dt);
      return;
    }

    /* burst */
    spawnAcc += 1.4 * dt;
    if (spawnAcc >= 1 && meteors.length < 70){ spawnAcc -= 1; spawnMeteor(); }
    drawMeteors(dt);

    var bp = Math.min(1, tPhase / 2.0);
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (var j = 0; j < parts.length; j++){
      var it = parts[j];
      var prog = Math.max(0, Math.min(1, (bp - it.d) / (1 - it.d)));
      var e = easeOut(prog);
      var px = it.sx + (it.tx - it.sx) * e;
      var py = it.sy + (it.ty - it.sy) * e;
      if (prog <= 0) continue;
      var alpha = (0.25 + 0.62 * e);
      // 汇聚途中拉出短迹
      if (prog < 0.94){
        var tailX = it.sx + (it.tx - it.sx) * Math.max(0, e - 0.06);
        var tailY = it.sy + (it.ty - it.sy) * Math.max(0, e - 0.06);
        ctx.beginPath();
        ctx.moveTo(px, py); ctx.lineTo(tailX, tailY);
        ctx.strokeStyle = "rgba(226,236,255," + (alpha * 0.35).toFixed(3) + ")";
        ctx.lineWidth = it.r * 0.9;
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.arc(px, py, it.r, 0, 6.2832);
      ctx.fillStyle = "rgba(" + (bp > 0.85 ? "255,244,222" : "214,230,255") + "," + alpha.toFixed(3) + ")";
      ctx.fill();
    }
    ctx.restore();

    if (tPhase > 2.1) document.getElementById("final").classList.add("on");
    if (tPhase > 4.9){
      document.getElementById("fade").classList.add("on");
      stopBgm();
    }
    if (tPhase > CONFIG.BURST){ location.href = CONFIG.home; }
  }

  function loop(ms){
    var now = ms / 1000;
    var dt = lastMs ? Math.min(0.05, now - lastMs) : 0.016;
    lastMs = now;
    tPhase += dt;
    render(dt, now);
    requestAnimationFrame(loop);
  }

  /* ---------- 可点的星 ---------- */
  var wishEl = document.getElementById("wish");
  var wishTextEl = document.getElementById("wish-text");
  var wstarEls = Array.prototype.slice.call(document.querySelectorAll(".wstar"));

  wstarEls.forEach(function(el){
    el.addEventListener("click", function(ev){
      ev.stopPropagation();
      var i = parseInt(el.getAttribute("data-i"), 10) || 0;
      wishTextEl.textContent = CONFIG.wishes[i % CONFIG.wishes.length];
      wishEl.classList.add("on");
      if (bgmEl && bgmEl.paused) playBgm();
    });
  });
  wishEl.addEventListener("click", function(){ wishEl.classList.remove("on"); });

  /* ---------- 背景音乐（本地 mp3） ---------- */
  var bgmEl = document.getElementById("bgm");
  var bgmTimer = null, bgmArmed = false;

  function setBgmBtn(on){
    var btn = document.getElementById("music");
    if (!btn) return;
    if (on){ btn.classList.add("on"); btn.style.display = "flex"; }
    else { btn.classList.remove("on"); }
  }

  function fadeBgmTo(v, ms, pauseEnd){
    if (!bgmEl) return;
    if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
    var from = bgmEl.volume, t0 = Date.now();
    bgmTimer = setInterval(function(){
      var k = Math.min(1, (Date.now() - t0) / ms);
      try { bgmEl.volume = Math.max(0, Math.min(1, from + (v - from) * k)); } catch (e) {}
      if (k >= 1){
        clearInterval(bgmTimer); bgmTimer = null;
        if (v <= 0.001 && pauseEnd !== false){ try { bgmEl.pause(); } catch (e) {} }
      }
    }, 50);
  }

  /* 浏览器会拦截无交互的自动播放：失败就等第一次点击/按键 */
  function armBgm(){
    if (bgmArmed) return;
    bgmArmed = true;
    var kick = function(){
      document.removeEventListener("pointerdown", kick);
      document.removeEventListener("touchstart", kick);
      document.removeEventListener("keydown", kick);
      bgmArmed = false;
      if (bgmEl && bgmEl.paused) playBgm();
    };
    document.addEventListener("pointerdown", kick);
    document.addEventListener("touchstart", kick);
    document.addEventListener("keydown", kick);
  }

  /* delayMs：先静音播放，过这么久再淡入（开场等穿越过去再起音乐） */
  function playBgm(delayMs){
    if (!bgmEl) return;
    try { bgmEl.volume = 0; } catch (e) {}
    var start = function(){
      setBgmBtn(true);
      var d = delayMs || 0;
      if (d > 0){
        setTimeout(function(){ fadeBgmTo(0.5, 3600); }, d);
      } else {
        fadeBgmTo(0.5, 3600);
      }
    };
    var pr = null;
    try { pr = bgmEl.play(); } catch (e) {}
    if (pr && pr.then){
      pr.then(start).catch(function(){ setBgmBtn(false); armBgm(); });
    } else {
      start();
    }
  }

  function stopBgm(){
    setBgmBtn(false);
    fadeBgmTo(0, 1500);
  }

  document.getElementById("music").addEventListener("click", function(){
    if (!bgmEl) return;
    if (bgmEl.paused) playBgm(); else stopBgm();
  });

  /* ---------- 标题卡三段递进 ---------- */
  var cardEl = document.getElementById("card");
  function showCard(){
    cardEl.classList.add("on");
    setTimeout(function(){ cardEl.classList.add("st1"); }, 300);
    setTimeout(function(){ cardEl.classList.add("st2"); }, 2900);
    setTimeout(function(){ cardEl.classList.add("st3"); }, 5500);
  }

  /* ---------- 启动 ---------- */
  function startShow(){
    if (phase !== "gate" && phase !== "init") return;
    phase = "warp"; tPhase = 0;
    buildWarp();
    var gd = document.getElementById("gate");
    gd.classList.add("gone");
    setTimeout(function(){ gd.style.display = "none"; }, 900);
    document.getElementById("skip").style.display = "block";
    setTimeout(function(){
      wstarEls.forEach(function(el, i){
        setTimeout(function(){ el.classList.add("show"); }, i * 160);
      });
    }, 800);
  }

  document.getElementById("skip").addEventListener("click", function(){
    location.href = CONFIG.home;
  });

  document.getElementById("next").addEventListener("click", function(){
    if (phase !== "card") return;
    wishEl.classList.remove("on");
    if (bgmEl && bgmEl.paused) playBgm();
    document.getElementById("card").classList.remove("on");
    setTimeout(function(){
      document.getElementById("card").style.display = "none";
      beginBurst();
    }, 1000);
  });

  var inp = document.getElementById("dob");
  var err = document.getElementById("err");

  inp.addEventListener("input", function(){
    var v = inp.value.replace(/\D/g, "").slice(0, 8);
    var out = v;
    if (v.length > 4) out = v.slice(0, 4) + "-" + v.slice(4);
    if (v.length > 6) out = v.slice(0, 4) + "-" + v.slice(4, 6) + "-" + v.slice(6);
    inp.value = out;
    err.classList.remove("show");
  });

  function submit(){
    var v = inp.value.replace(/\D/g, "");
    if (v === CONFIG.answer){
      startShow();
    } else {
      err.classList.add("show");
      inp.classList.remove("shake");
      void inp.offsetWidth;
      inp.classList.add("shake");
    }
  }

  document.getElementById("go").addEventListener("click", submit);
  inp.addEventListener("keydown", function(e){ if (e.key === "Enter") submit(); });
  document.getElementById("tip").addEventListener("click", function(){
    document.getElementById("tip").textContent = "2007 年的那个冬天";
  });

  document.getElementById("sub1").textContent = CONFIG.sub1;
  document.getElementById("sub2").textContent = CONFIG.sub2;

  window.addEventListener("resize", resize);
  resize();

  var tapEl = document.getElementById("tap");
  if (tapEl){
    tapEl.addEventListener("click", function(){
      if (tapEl.classList.contains("gone")) return;
      tapEl.classList.add("gone");
      setTimeout(function(){ tapEl.style.display = "none"; }, 950);
      playBgm(3000);
      startShow();
    });
  }

  if (CONFIG.needCode){
    phase = "gate";
    tapEl.style.display = "none";
    document.getElementById("skip").style.display = "none";
  } else if (!CONFIG.autoStart){
    phase = "gate";
    tapEl.style.display = "flex";
    document.getElementById("gate").style.display = "none";
    document.getElementById("skip").style.display = "none";
  } else {
    document.getElementById("gate").style.display = "none";
    phase = "init";
    setTimeout(startShow, 320);
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
