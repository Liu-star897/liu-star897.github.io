<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>写给你的信</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="sky"></canvas>
<a class="back" href="index.html">← 回到首页</a>

<div class="letter-stage">
  <article class="paper">
    <h1>给 你</h1>
    <p>这封信我想了很久要不要写。写下来好像有点郑重，可这一年里，确实有好多话没找到合适的时候说。</p>
    <p>先说最重要的：生日快乐。希望这一天你过得松弛一点，不用赶任何事，想睡就睡，想吃什么就去吃，谁都别来烦你。</p>
    <p>认识你之后我经常觉得，人跟人能碰上真是很奇妙的事。那么多条路上，刚好我们走到了同一条。</p>
    <p>你说过的一些话我记着，有些当时没接住，回头想想还挺后悔的。所以借着这个机会补一句：那些话我都有认真听。</p>
    <p>新的一岁，不用变得多厉害。平安、开心、身边有人陪着，就已经很好了。</p>
    <p class="sign">—— 你的朋友</p>
  </article>
</div>

<script>
(function(){
  var c = document.getElementById('sky'), x = c.getContext('2d');
  var W = 0, H = 0, dpr = Math.min(devicePixelRatio || 1, 2), dots = [];
  function resize(){
    W = c.width = innerWidth * dpr; H = c.height = innerHeight * dpr;
    c.style.width = innerWidth + 'px'; c.style.height = innerHeight + 'px';
    dots = [];
    var n = Math.round((innerWidth * innerHeight) / 14000);
    for (var i = 0; i < n; i++) dots.push({x:Math.random()*W, y:Math.random()*H, r:(Math.random()*1.1+.3)*dpr, a:Math.random()*.35+.1});
  }
  function draw(){
    x.clearRect(0,0,W,H);
    for (var i=0;i<dots.length;i++){
      var d = dots[i];
      x.beginPath(); x.arc(d.x,d.y,d.r,0,6.2832);
      x.fillStyle = 'rgba(240,214,170,' + d.a + ')'; x.fill();
    }
  }
  addEventListener('resize', function(){ resize(); draw(); });
  resize(); draw();
})();
</script>
</body>
</html>
