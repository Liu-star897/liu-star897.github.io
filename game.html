<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>星星小游戏</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#05080f}
  body{display:flex;align-items:center;justify-content:center;
       font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#e8eefc}
  #box{position:relative;width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16));
       background:#0a1020;overflow:hidden;box-shadow:0 0 70px rgba(0,0,0,.65)}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  .back{position:absolute;right:2%;top:3.2%;font-size:13px;letter-spacing:.12em;color:#f0e2c8;
        text-decoration:none;padding:8px 15px;border:1px solid rgba(240,220,180,.28);
        border-radius:999px;background:rgba(10,14,26,.5);backdrop-filter:blur(6px);z-index:6}
  .back:active{background:rgba(240,220,180,.16)}
  #pads{position:absolute;inset:0;pointer-events:none;z-index:5}
  .pad{position:absolute;bottom:5%;width:clamp(54px,8.4vh,74px);height:clamp(54px,8.4vh,74px);
       display:flex;flex-direction:column;align-items:center;justify-content:center;
       font-size:21px;line-height:1;color:#fff6e6;
       background:rgba(18,14,28,.5);border:1px solid rgba(255,236,200,.34);
       border-radius:18px;backdrop-filter:blur(4px);pointer-events:auto;
       user-select:none;-webkit-user-select:none;touch-action:none;
       box-shadow:0 2px 10px rgba(0,0,0,.25);
       transition:transform .07s,background .1s}
  .pad i{font-style:normal;font-size:9.5px;opacity:.68;margin-top:3px;letter-spacing:.12em}
  .pad.on{background:rgba(255,206,140,.5);transform:scale(.93)}
  .pad.l{left:3.5%}
  .pad.r{left:calc(3.5% + clamp(54px,8.4vh,74px) + 12px)}
  .pad.j{right:4.5%;width:clamp(62px,9.6vh,84px);height:clamp(62px,9.6vh,84px);border-radius:50%}
</style>
</head>
<body>
<div id="box">
  <a class="back" href="home.html">← 回夜市</a>
  <canvas id="cv"></canvas>
  <div id="pads">
    <div class="pad l" data-k="left">←<i>走</i></div>
    <div class="pad r" data-k="right">→<i>走</i></div>
    <div class="pad j" data-k="jump">↑<i>跳</i></div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ==========================================================
   想改这个游戏，基本只动这两块
   ========================================================== */
var CONFIG = {
  floor: 350,        // 地面高度（越小地面越高）
  gravity: 2400,     // 重力，越大掉得越快、跳得越低
  jump: -780,        // 起跳力度，越负跳得越高
  jumpCut: -260,
  walk: 300,         // 按住方向键走的速度（px/秒）
  clampL: 40,        // 最左边能退到哪
  fallDeath: 640
};

var LEVEL = {
  len: 36000,        // 整条路多长：36000 ÷ 300 = 120 秒，加上跳障碍约 3 分钟
  cpCount: 3,        // 中途检查点数量（摔死了从这里重来）
  castle: "奖 励",   // 城堡门口显示的字
  rewardTitle: "奖 励",
  rewardText: "（这里要放的东西，等你说）"
};

/* ==========================================================
   引擎（不改也能玩）
   ========================================================== */
var cv = document.getElementById("cv");
var ctx = cv.getContext("2d");
var W = 800, H = 450, FLOOR = CONFIG.floor;
var LEN = LEVEL.len;

function fit(){
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
}
fit();
window.addEventListener("resize", fit);

/* 可选：img/player.png 存在就替换掉默认小人 */
var playerImg = new Image();
var hasPlayerImg = false;
playerImg.onload = function(){ hasPlayerImg = true; };
playerImg.src = "img/player.png";

/* ---------- 生成整条路 ---------- */
function genWorld(){
  var segs = [], spikes = [], gears = [], plats = [], coins = [], cps = [], enemies = [];
  var x = 0, i = 0;

  while (x < LEN - 2600){
    var kind = i % 6;
    var w = 780 + ((i * 37) % 3) * 130;   // 780 / 910 / 1040
    var b = x;

    if (kind === 2){
      /* 宽坑：中间架一块木板，必须踩过去 */
      var gw = 300 + ((i * 17) % 2) * 44;
      segs.push([b, b + 280]);
      segs.push([b + 280 + gw, b + w]);
      plats.push({ x: b + 280 + gw / 2 - 70, y: FLOOR - 84, w: 140, span: 0, sp: 0, ph: 0 });
      coins.push({ x: b + 280 + gw * 0.5, y: FLOOR - 138 });
    } else {
      segs.push([b, b + w]);
    }

    /* 金币 */
    var n = 4 + (i % 3);
    for (var k = 0; k < n; k++){
      coins.push({ x: b + 130 + k * 86, y: FLOOR - 48 });
    }

    /* 障碍与怪 */
    if (kind === 0){
      if (i > 0){
        enemies.push({ x: b + 520, x0: b + 320, x1: b + 720, y: FLOOR - 28, w: 28, h: 28, dir: -1, dead: 0 });
      }
    } else if (kind === 1){
      spikes.push({ x: b + 380, n: 2 + (i % 3) });
      enemies.push({ x: b + 690, x0: b + 620, x1: b + 770, y: FLOOR - 28, w: 28, h: 28, dir: -1, dead: 0 });
    } else if (kind === 3){
      gears.push({ x: b + 420, y: FLOOR - 34, r: 20, span: 0, sp: 0, ph: 0 });
      if (w > 880) gears.push({ x: b + 700, y: FLOOR - 34, r: 17, span: 90, sp: 0.9, ph: i });
    } else if (kind === 4){
      /* 会来回动的平台，上方那串币只有跳上去才吃得到 */
      plats.push({ x: b + 350, y: FLOOR - 120, w: 110, span: 108, sp: 0.8, ph: i % 3 });
      for (var c2 = 0; c2 < 4; c2++){
        coins.push({ x: b + 360 + c2 * 32, y: FLOOR - 160 });
      }
    } else if (kind === 5){
      spikes.push({ x: b + 320, n: 2 });
      gears.push({ x: b + 640, y: FLOOR - 34, r: 19, span: 0, sp: 0, ph: 0 });
    }

    x += w;
    i++;
  }

  /* 城堡前庭：一路平地，撒满星星 */
  segs.push([x, LEN + 600]);
  for (var m = 0; m < 34; m++){
    var gx = x + 90 + m * 66;
    if (gx > LEN - 190) break;
    coins.push({ x: gx, y: FLOOR - 48 - (m % 4 === 0 ? 30 : 0) });
  }

  /* 检查点要落在实地上 */
  function snap(px){
    for (var s = 0; s < segs.length; s++){
      if (px >= segs[s][0] + 60 && px <= segs[s][1] - 60) return px;
    }
    for (var t = 0; t < segs.length; t++){
      if (segs[t][1] > px) return segs[t][0] + 120;
    }
    return 120;
  }
  for (var p = 1; p <= LEVEL.cpCount; p++){
    cps.push(snap(Math.round(LEN * p / (LEVEL.cpCount + 1))));
  }

  return { segs: segs, spikes: spikes, gears: gears, plats: plats,
           coins: coins, cps: cps, enemies: enemies, end: LEN };
}

var W2 = genWorld();

/* ---------- 状态 ---------- */
var player = { x: 70, y: FLOOR - 40, w: 28, h: 40, vy: 0, vx: 0, ground: false, runT: 0, plat: null };
var input = { left: false, right: false };

/* ---------- 音效：全部现场合成，不用音频文件 ---------- */
var AC = null;
function ac(){
  if (!AC){
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; }
  }
  if (AC && AC.state === "suspended") AC.resume();
  return AC;
}
function tone(f0, f1, dur, type, vol){
  var c = ac(); if (!c) return;
  var o = c.createOscillator(), g = c.createGain();
  o.type = type || "sine";
  o.frequency.setValueAtTime(f0, c.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), c.currentTime + dur);
  g.gain.setValueAtTime(vol || 0.05, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
  o.connect(g); g.connect(c.destination);
  o.start(); o.stop(c.currentTime + dur + 0.02);
}
var lastCoinSnd = 0;
var SFX = {
  jump: function(){ tone(420, 690, 0.12, "square", 0.03); },
  coin: function(){
    var t = Date.now();
    if (t - lastCoinSnd < 55) return;
    lastCoinSnd = t;
    tone(1046, 1568, 0.08, "triangle", 0.045);
  },
  stomp: function(){ tone(250, 90, 0.14, "sawtooth", 0.05); },
  die: function(){ tone(330, 70, 0.45, "sawtooth", 0.055); },
  check: function(){ tone(660, 990, 0.22, "triangle", 0.05); },
  win: function(){
    [523.25, 659.25, 783.99, 1046.5].forEach(function(f, k){
      setTimeout(function(){ tone(f, f * 1.01, 0.34, "triangle", 0.05); }, k * 150);
    });
  }
};
var camX = 0, coinsGot = 0, state = "play", deadT = 0, holdT = 0;
var holding = false, hintT = 1.8, tAll = 0, shake = 0;
var startX = 70, cpReached = 0, winT = 0, doorOpen = 0;

function reset(fromCp){
  player.x = fromCp ? startX : 70;
  player.y = FLOOR - player.h;
  player.vy = 0; player.vx = 0; player.ground = false; player.plat = null;
  input.left = false; input.right = false; holding = false;
  camX = player.x - W * 0.36;
  if (!fromCp) { coinsGot = 0; cpReached = 0; startX = 70; }
  state = "play"; deadT = 0; winT = 0; doorOpen = 0; shake = 0;
  for (var ei = 0; ei < W2.enemies.length; ei++){
    var en0 = W2.enemies[ei];
    en0.dead = false; en0.x = en0.x0; en0.dir = -1;
  }
  hintT = fromCp ? 0 : 4;
}
reset();

/* ---------- 输入 ---------- */
function jump(){
  if (state === "dead"){ if (deadT > 0.55) reset(cpReached > 0); return; }
  if (state === "win"){ if (winT > 1.5) reset(false); return; }
  if (player.ground || player.plat){
    player.vy = CONFIG.jump;
    player.ground = false; player.plat = null;
    hintT = 0; holdT = 0;
    holding = true;
    SFX.jump();
  }
}

function setKey(k, on){
  if (k === "jump"){
    if (on) jump(); else holding = false;
  } else if (k === "left" || k === "right"){
    input[k] = on;
  }
}

var KEYMAP = {
  ArrowLeft: "left", KeyA: "left",
  ArrowRight: "right", KeyD: "right",
  Space: "jump", ArrowUp: "jump", KeyW: "jump"
};

window.addEventListener("keydown", function(e){
  var k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  if (e.repeat) return;
  setKey(k, true);
});
window.addEventListener("keyup", function(e){
  var k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  setKey(k, false);
});

/* 屏幕上的三个按键 */
Array.prototype.forEach.call(document.querySelectorAll(".pad"), function(el){
  var k = el.getAttribute("data-k");
  function down(e){
    e.preventDefault();
    el.classList.add("on");
    setKey(k, true);
  }
  function up(e){
    e.preventDefault();
    el.classList.remove("on");
    setKey(k, false);
  }
  el.addEventListener("touchstart", down, { passive: false });
  el.addEventListener("touchend", up, { passive: false });
  el.addEventListener("touchcancel", up, { passive: false });
  el.addEventListener("mousedown", down);
  el.addEventListener("mouseup", up);
  el.addEventListener("mouseleave", up);
});

/* 点画面也能跳（手指不落在按键上时） */
cv.addEventListener("touchstart", function(e){ e.preventDefault(); jump(); }, { passive: false });
cv.addEventListener("mousedown", function(e){ e.preventDefault(); jump(); });

/* ---------- 碰撞小工具 ---------- */
function segAt(x){
  for (var i = 0; i < W2.segs.length; i++){
    var s = W2.segs[i];
    if (x >= s[0] && x < s[1]) return s;
  }
  return null;
}
function hint(x){ return x < W2.segs[0][0] || x > W2.segs[W2.segs.length - 1][1]; }
function overlap(ax, ay, aw, ah, bx, by, bw, bh){
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}
function platRect(p, t){ return { x: p.x + Math.sin(t * p.sp + p.ph) * p.span, y: p.y, w: p.w, h: 16 }; }
function gearPos(g, t){ return { x: g.x + Math.sin(t * g.sp + g.ph) * g.span, y: g.y, r: g.r }; }

/* ---------- 更新 ---------- */
function die(){ state = "dead"; deadT = 0; shake = 1; SFX.die(); }

function update(dt){
  tAll += dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 3);

  if (state === "dead"){ deadT += dt; return; }
  if (state === "win"){
    winT += dt;
    doorOpen = Math.min(1, doorOpen + dt * 1.3);
    if (player.x < W2.end - 10) player.x += 70 * dt;
    var cw = player.x - W * 0.36;
    if (cw > W2.end + 170 - W) cw = W2.end + 170 - W;
    camX += (cw - camX) * Math.min(1, dt * 9);
    return;
  }
  if (hintT > 0) hintT -= dt;

  var vx = 0;
  if (input.right) vx += CONFIG.walk;
  if (input.left) vx -= CONFIG.walk;
  player.vx = vx;
  player.x += vx * dt;
  if (player.x < CONFIG.clampL) player.x = CONFIG.clampL;
  if (vx !== 0) player.runT += dt;

  /* 按住跳得更高 */
  if (holding && !player.ground && !player.plat && player.vy < 0){
    holdT += dt;
    if (holdT < 0.18 && player.vy > CONFIG.jumpCut) player.vy -= CONFIG.gravity * 0.6 * dt;
  }

  var prevBottom = player.y + player.h;
  player.vy += CONFIG.gravity * dt;
  player.y += player.vy * dt;

  /* 平台 */
  for (var i = 0; i < W2.plats.length; i++){
    var pr = platRect(W2.plats[i], tAll);
    if (pr.x > player.x + 400 || pr.x + pr.w < player.x - 200) continue;
    var on = player.x + player.w * 0.72 > pr.x && player.x + player.w * 0.28 < pr.x + pr.w;
    var feet = player.y + player.h;
    if (on && player.vy >= 0 && feet >= pr.y - 2 && prevBottom <= pr.y + 14){
      player.y = pr.y - player.h; player.vy = 0; player.plat = W2.plats[i];
    }
  }

  /* 地面 */
  var seg = segAt(player.x + player.w * 0.5);
  player.ground = false;
  if (seg && player.vy >= 0 && player.y + player.h >= FLOOR && prevBottom <= FLOOR + 8){
    player.y = FLOOR - player.h; player.vy = 0; player.ground = true; player.plat = null;
  }

  var camTarget = player.x - W * 0.36;
  if (camTarget < 0) camTarget = 0;
  if (camTarget > W2.end + 170 - W) camTarget = W2.end + 170 - W;
  camX += (camTarget - camX) * Math.min(1, dt * 9);

  /* 金币 */
  for (var c = 0; c < W2.coins.length; c++){
    var coin = W2.coins[c];
    if (coin.got) continue;
    if (coin.x < camX - 60 || coin.x > camX + W + 60) continue;
    if (overlap(player.x, player.y, player.w, player.h, coin.x - 12, coin.y - 12, 24, 24)){
      coin.got = true; coinsGot++; SFX.coin();
    }
  }

  /* 尖刺 */
  for (var s2 = 0; s2 < W2.spikes.length; s2++){
    var sp = W2.spikes[s2];
    if (sp.x < camX - 100 || sp.x > camX + W + 100) continue;
    if (overlap(player.x + 5, player.y + 7, player.w - 10, player.h - 7,
                sp.x, FLOOR - 18, 18 * sp.n, 18)) return die();
  }

  /* 齿轮 */
  for (var g2 = 0; g2 < W2.gears.length; g2++){
    var gg = W2.gears[g2];
    if (gg.x < camX - 200 || gg.x > camX + W + 200) continue;
    var gp = gearPos(gg, tAll);
    var cxp = player.x + player.w / 2, cyp = player.y + player.h / 2;
    var dx = cxp - gp.x, dy = cyp - gp.y, rr = gp.r + 13;
    if (dx * dx + dy * dy < rr * rr) return die();
  }

  /* 蘑菇怪 */
  for (var en2 = 0; en2 < W2.enemies.length; en2++){
    var en = W2.enemies[en2];
    if (en.dead) continue;
    if (en.x < camX - 320 || en.x > camX + W + 320) continue;
    en.x += en.dir * 58 * dt;
    if (en.x < en.x0){ en.x = en.x0; en.dir = 1; }
    if (en.x > en.x1){ en.x = en.x1; en.dir = -1; }
    if (overlap(player.x + 4, player.y + 8, player.w - 8, player.h - 8, en.x, en.y, en.w, en.h)){
      if (player.vy > 60 && prevBottom <= en.y + 14){
        en.dead = true;
        player.vy = -520;
        coinsGot++;
        SFX.stomp();
      } else {
        return die();
      }
    }
  }

  /* 检查点 */
  if (cpReached < W2.cps.length && player.x >= W2.cps[cpReached]){
    cpReached++;
    startX = W2.cps[cpReached - 1];
    SFX.check();
  }

  if (player.y > CONFIG.fallDeath) return die();

  /* 到城堡 */
  if (player.x + player.w > W2.end - 52 && state === "play"){ state = "win"; winT = 0; doorOpen = 0; SFX.win(); }
}

/* ---------- 画面 ---------- */
function bg(){
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#b7e4a6");
  g.addColorStop(0.46, "#d6d5ea");
  g.addColorStop(1, "#ecd9ec");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = "rgba(150,205,158,.42)";
  for (var i = 0; i < 5; i++){
    var bx = ((i * 260 - camX * 0.12) % (W + 400) + W + 400) % (W + 400) - 200;
    ctx.beginPath();
    ctx.moveTo(bx - 190, FLOOR + 4);
    ctx.quadraticCurveTo(bx, FLOOR - 118, bx + 190, FLOOR + 4);
    ctx.fill();
  }
  ctx.fillStyle = "rgba(255,255,255,.55)";
  for (var j = 0; j < 4; j++){
    var cx = ((j * 320 - camX * 0.34) % (W + 500) + W + 500) % (W + 500) - 250;
    var cy = 60 + (j % 3) * 34;
    ctx.beginPath();
    ctx.arc(cx, cy, 26, 0, 7); ctx.arc(cx + 26, cy + 6, 19, 0, 7); ctx.arc(cx - 24, cy + 8, 16, 0, 7);
    ctx.fill();
  }
}

function drawFloor(){
  /* 地平线以下先刷成深渊，没铺地面的地方就是掉下去的坑 */
  var dg = ctx.createLinearGradient(0, FLOOR, 0, H);
  dg.addColorStop(0, "#2c1c18");
  dg.addColorStop(1, "#120a0c");
  ctx.fillStyle = dg;
  ctx.fillRect(0, FLOOR, W, H - FLOOR);

  for (var i = 0; i < W2.segs.length; i++){
    var s = W2.segs[i];
    var x0 = s[0] - camX, x1 = s[1] - camX;
    if (x1 < -40 || x0 > W + 40) continue;
    ctx.fillStyle = "#a9562f";
    ctx.fillRect(x0, FLOOR, x1 - x0, H - FLOOR);
    ctx.fillStyle = "#d98a55";
    ctx.fillRect(x0, FLOOR, x1 - x0, 9);
    ctx.fillStyle = "rgba(0,0,0,.16)";
    for (var x = Math.floor(x0 / 34) * 34; x < x1; x += 34){
      ctx.fillRect(x, FLOOR + 12, 3, H - FLOOR - 12);
    }
    ctx.fillStyle = "rgba(255,255,255,.14)";
    ctx.fillRect(x0, FLOOR + 9, x1 - x0, 2);
  }
}

function drawCoins(){
  for (var i = 0; i < W2.coins.length; i++){
    var c = W2.coins[i];
    if (c.got) continue;
    var x = c.x - camX;
    if (x < -30 || x > W + 30) continue;
    var y = c.y + Math.sin(tAll * 3 + i) * 4;
    ctx.beginPath(); ctx.arc(x, y, 9, 0, 7);
    ctx.fillStyle = "#ffcb3d"; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = "#c98a12"; ctx.stroke();
    ctx.beginPath(); ctx.arc(x - 2.5, y - 2.5, 3, 0, 7);
    ctx.fillStyle = "rgba(255,255,255,.85)"; ctx.fill();
  }
}

function drawSpikes(){
  for (var i = 0; i < W2.spikes.length; i++){
    var sp = W2.spikes[i];
    var sx = sp.x - camX;
    if (sx < -120 || sx > W + 120) continue;
    for (var n = 0; n < sp.n; n++){
      var x = sx + n * 18;
      ctx.beginPath();
      ctx.moveTo(x, FLOOR);
      ctx.lineTo(x + 9, FLOOR - 20);
      ctx.lineTo(x + 18, FLOOR);
      ctx.closePath();
      ctx.fillStyle = "#dcdce8"; ctx.fill();
      ctx.lineWidth = 1.5; ctx.strokeStyle = "#8f8fa6"; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x + 9, FLOOR - 20); ctx.lineTo(x + 9, FLOOR - 6);
      ctx.strokeStyle = "rgba(255,255,255,.9)"; ctx.lineWidth = 2; ctx.stroke();
    }
  }
}

function drawGears(){
  for (var i = 0; i < W2.gears.length; i++){
    var g = W2.gears[i];
    var gp = gearPos(g, tAll);
    var x = gp.x - camX;
    if (x < -80 || x > W + 80) continue;
    ctx.save();
    ctx.translate(x, gp.y);
    ctx.rotate(tAll * 2.4);
    ctx.fillStyle = "#9aa0b4";
    for (var k = 0; k < 8; k++){
      ctx.save(); ctx.rotate(k * Math.PI / 4);
      ctx.fillRect(-4, -gp.r - 6, 8, 9);
      ctx.restore();
    }
    ctx.beginPath(); ctx.arc(0, 0, gp.r, 0, 7);
    ctx.fillStyle = "#b9bfd2"; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = "#6f7590"; ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, gp.r * 0.34, 0, 7);
    ctx.fillStyle = "#6f7590"; ctx.fill();
    ctx.restore();
  }
}

function drawPlats(){
  for (var i = 0; i < W2.plats.length; i++){
    var pr = platRect(W2.plats[i], tAll);
    var x = pr.x - camX;
    if (x < -200 || x > W + 200) continue;
    ctx.fillStyle = "#9c5b33";
    ctx.fillRect(x, pr.y, pr.w, 16);
    ctx.fillStyle = "#cf8b58";
    ctx.fillRect(x, pr.y, pr.w, 6);
    ctx.fillStyle = "rgba(0,0,0,.18)";
    for (var b = x + 12; b < x + pr.w - 6; b += 20) ctx.fillRect(b, pr.y + 8, 2, 7);
  }
}

function drawEnemies(){
  for (var i = 0; i < W2.enemies.length; i++){
    var en = W2.enemies[i];
    var x = en.x - camX;
    if (x < -90 || x > W + 90) continue;
    var y = en.y;
    ctx.save();
    ctx.translate(x + en.w / 2, FLOOR);
    ctx.scale(1.18, 1.18);
    ctx.translate(-(x + en.w / 2), -FLOOR);
    if (en.dead){
      ctx.fillStyle = "#8a5334";
      ctx.beginPath();
      ctx.ellipse(x + en.w / 2, FLOOR - 5, en.w / 2 + 3, 6, 0, 0, 7);
      ctx.fill();
      ctx.restore();
      continue;
    }
    /* 腿 */
    ctx.fillStyle = "#6f4327";
    ctx.fillRect(x + 6, y + 22, 6, 7);
    ctx.fillRect(x + 16, y + 22, 6, 7);
    /* 伞盖 */
    ctx.fillStyle = "#c8574b";
    ctx.beginPath();
    ctx.moveTo(x - 1, y + 22);
    ctx.quadraticCurveTo(x + 14, y - 5, x + 29, y + 22);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = "#9c3f37"; ctx.lineWidth = 1.4; ctx.stroke();
    /* 白点 */
    ctx.fillStyle = "#fff1de";
    ctx.beginPath(); ctx.arc(x + 9, y + 12, 3.4, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 20, y + 14, 2.8, 0, 7); ctx.fill();
    /* 眼睛 */
    ctx.fillStyle = "#241a1a";
    ctx.beginPath(); ctx.arc(x + 9, y + 21, 1.9, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 18, y + 21, 1.9, 0, 7); ctx.fill();
    ctx.restore();
  }
}

/* 检查点小旗 */
function drawCheckpoints(){
  for (var i = 0; i < W2.cps.length; i++){
    var x = W2.cps[i] - camX;
    if (x < -60 || x > W + 60) continue;
    var on = cpReached > i;
    ctx.fillStyle = "#8a6a4a";
    ctx.fillRect(x, FLOOR - 54, 4, 54);
    ctx.beginPath();
    ctx.moveTo(x + 4, FLOOR - 54);
    ctx.lineTo(x + 34, FLOOR - 46);
    ctx.lineTo(x + 4, FLOOR - 38);
    ctx.closePath();
    ctx.fillStyle = on ? "#ffd24a" : "rgba(200,200,210,.45)";
    ctx.fill();
  }
}

/* 终点城堡 */
function drawCastle(){
  var x = W2.end - camX;
  if (x < -500 || x > W + 600) return;
  var base = FLOOR;

  /* 门前台阶 + 地面暗影 */
  ctx.fillStyle = "rgba(60,40,30,.16)";
  ctx.beginPath(); ctx.ellipse(x, base + 12, 250, 14, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#cbbbA5";
  ctx.fillRect(x - 150, base - 12, 300, 12);
  ctx.fillStyle = "#bcab94";
  ctx.fillRect(x - 118, base - 22, 236, 10);
  ctx.fillStyle = "#b8a894";
  ctx.fillRect(x - 190, base - 185, 380, 163);
  ctx.fillStyle = "rgba(60,40,40,.10)";
  ctx.fillRect(x - 190, base - 185, 54, 163);

  /* 两侧塔 */
  for (var s = -1; s <= 1; s += 2){
    var tx = x + s * 192 - 48;
    ctx.fillStyle = "#c9b9a4";
    ctx.fillRect(tx, base - 250, 96, 250);
    ctx.fillStyle = "rgba(60,40,40,.12)";
    ctx.fillRect(tx, base - 250, s < 0 ? 30 : 24, 250);
    /* 塔顶 */
    ctx.fillStyle = "#c4695b";
    ctx.beginPath();
    ctx.moveTo(tx - 12, base - 250);
    ctx.lineTo(tx + 48, base - 308);
    ctx.lineTo(tx + 108, base - 250);
    ctx.closePath(); ctx.fill();
    /* 旗子 */
    ctx.strokeStyle = "#8a6a4a"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(tx + 48, base - 308); ctx.lineTo(tx + 48, base - 336); ctx.stroke();
    ctx.fillStyle = "#ffcf5e";
    ctx.beginPath();
    ctx.moveTo(tx + 48, base - 336);
    ctx.lineTo(tx + 74, base - 328);
    ctx.lineTo(tx + 48, base - 320);
    ctx.closePath(); ctx.fill();
    /* 窗 */
    for (var wv = 0; wv < 2; wv++){
      for (var hv = 0; hv < 3; hv++){
        ctx.fillStyle = hv === 2 ? "rgba(255,224,160,.5)" : "#ffe0a0";
        ctx.fillRect(tx + (wv ? 56 : 22), base - 232 + hv * 40, 16, 23);
      }
    }
  }

  /* 中间主体 */
  ctx.fillStyle = "#cbbaa6";
  ctx.fillRect(x - 96, base - 215, 192, 193);
  ctx.fillStyle = "rgba(60,40,40,.10)";
  ctx.fillRect(x - 96, base - 215, 26, 193);
  ctx.fillStyle = "#c4695b";
  ctx.beginPath();
  ctx.moveTo(x - 110, base - 215);
  ctx.lineTo(x, base - 286);
  ctx.lineTo(x + 110, base - 215);
  ctx.closePath(); ctx.fill();

  /* 城门 */
  var dw = 96, dh = 138;
  var dz = doorOpen * 44;
  ctx.fillStyle = "#2d2338";
  ctx.fillRect(x - dw / 2, base - dh, dw, dh);
  /* 门里透出来的光 */
  ctx.save();
  ctx.beginPath();
  ctx.rect(x - dw / 2, base - dh, dw, dh);
  ctx.clip();
  var lg = ctx.createLinearGradient(0, base - dh, 0, base);
  lg.addColorStop(0, "rgba(255,246,214," + (0.35 + doorOpen * 0.6) + ")");
  lg.addColorStop(1, "rgba(255,214,150," + (0.15 + doorOpen * 0.6) + ")");
  ctx.fillStyle = lg;
  ctx.fillRect(x - dw / 2, base - dh, dw, dh);
  if (doorOpen > 0.5){
    ctx.fillStyle = "rgba(255,255,255," + (0.35 * (doorOpen - 0.5) * 2) + ")";
    ctx.fillRect(x - dw / 2, base - dh, dw, dh);
  }
  ctx.restore();
  /* 两扇门 */
  ctx.fillStyle = "#6a4a34";
  ctx.fillRect(x - dw / 2 - dz, base - dh, dw / 2, dh);
  ctx.fillRect(x + dz - 2, base - dh, dw / 2 + 2, dh);
  ctx.strokeStyle = "rgba(0,0,0,.25)"; ctx.lineWidth = 2;
  ctx.strokeRect(x - dw / 2 - dz, base - dh, dw / 2, dh);
  ctx.strokeRect(x + dz, base - dh, dw / 2, dh);

  /* 门顶的字 */
  ctx.save();
  ctx.textAlign = "center";
  ctx.font = "bold 20px -apple-system,'PingFang SC',sans-serif";
  ctx.fillStyle = "#fff6e2";
  ctx.shadowColor = "rgba(255,200,120,.9)";
  ctx.shadowBlur = 12;
  ctx.fillText(LEVEL.castle, x, base - 150);
  ctx.restore();

  /* 城墙上的小灯 */
  for (var l = -2; l <= 2; l++){
    if (l === 0) continue;
    var lx = x + l * 46;
    ctx.beginPath(); ctx.arc(lx, base - 232, 4, 0, 7);
    ctx.fillStyle = "rgba(255,214,140,.95)"; ctx.fill();
    ctx.beginPath(); ctx.arc(lx, base - 232, 9, 0, 7);
    ctx.fillStyle = "rgba(255,200,120,.18)"; ctx.fill();
  }
}

function drawPlayer(){
  var x = player.x - camX, y = player.y;
  if (state === "dead" && Math.floor(deadT * 12) % 2 === 0) return;
  if (hasPlayerImg){
    ctx.drawImage(playerImg, x - 2, y - 4, player.w + 4, player.h + 4);
    return;
  }
  var swing = player.vx ? Math.sin(player.runT * 16) * 4 : 0;
  ctx.fillStyle = "#e8829e";
  ctx.fillRect(x + 6, y + 30, 6, 10 + swing * 0.4);
  ctx.fillRect(x + 16, y + 30, 6, 10 - swing * 0.4);
  ctx.fillStyle = "#ffb0c8";
  ctx.beginPath();
  ctx.moveTo(x + 4, y + 32);
  ctx.lineTo(x + 4, y + 20);
  ctx.quadraticCurveTo(x + 14, y + 14, x + 24, y + 20);
  ctx.lineTo(x + 24, y + 32);
  ctx.closePath(); ctx.fill();
  ctx.lineWidth = 1.5; ctx.strokeStyle = "#d8798f"; ctx.stroke();
  ctx.beginPath(); ctx.arc(x + 14, y + 13, 13, 0, 7);
  ctx.fillStyle = "#fffaf5"; ctx.fill();
  ctx.strokeStyle = "#e0a8b6"; ctx.stroke();
  ctx.fillStyle = "#2b2333";
  ctx.beginPath(); ctx.arc(x + 9.5, y + 12, 2, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 18.5, y + 12, 2, 0, 7); ctx.fill();
  ctx.fillStyle = "rgba(255,150,180,.7)";
  ctx.beginPath(); ctx.arc(x + 6, y + 18, 2.6, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 22, y + 18, 2.6, 0, 7); ctx.fill();
}

function drawHUD(){
  /* 金币 */
  ctx.fillStyle = "rgba(20,26,40,.55)";
  ctx.fillRect(14, 14, 178, 34);
  ctx.font = "bold 20px Menlo,Consolas,monospace";
  ctx.textBaseline = "top"; ctx.textAlign = "left";
  ctx.fillStyle = "#fff";
  ctx.fillText("YOU GOT: " + coinsGot, 24, 21);

  /* 进度 */
  var pct = Math.max(0, Math.min(1, player.x / W2.end));
  ctx.fillStyle = "rgba(20,26,40,.35)";
  ctx.fillRect(W / 2 - 130, 24, 260, 8);
  var gr = ctx.createLinearGradient(W / 2 - 130, 0, W / 2 + 130, 0);
  gr.addColorStop(0, "#ffd24a"); gr.addColorStop(1, "#ff9fc4");
  ctx.fillStyle = gr;
  ctx.fillRect(W / 2 - 130, 24, 260 * pct, 8);
  ctx.font = "11px -apple-system,'PingFang SC',sans-serif";
  ctx.textAlign = "center";
  ctx.fillStyle = "rgba(60,50,70,.6)";
  ctx.fillText(Math.round(pct * 100) + "%", W / 2, 38);

  if (hintT > 0 && state === "play"){
    ctx.globalAlpha = Math.min(1, hintT);
    ctx.font = "16px -apple-system,'PingFang SC',sans-serif";
    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(40,44,60,.7)";
    ctx.fillRect(W / 2 - 150, H * 0.28, 300, 34);
    ctx.fillStyle = "#fff";
    ctx.fillText("←  →  走        ↑  跳", W / 2, H * 0.28 + 10);
    ctx.globalAlpha = 1;
  }

  if (state === "dead"){
    ctx.fillStyle = "rgba(120,20,40," + Math.min(0.45, deadT * 1.4) + ")";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = "#fff";
    ctx.font = "bold 30px -apple-system,'PingFang SC',sans-serif";
    ctx.fillText("再 来 一 次", W / 2, H / 2 - 20);
    ctx.font = "15px -apple-system,'PingFang SC',sans-serif";
    ctx.fillStyle = "rgba(255,255,255,.85)";
    ctx.fillText(cpReached > 0 ? "从第 " + cpReached + " 个旗子那儿重来" : "这一次拿到了 " + coinsGot + " 枚", W / 2, H / 2 + 20);
    if (deadT > 0.55) ctx.fillText("点 一 下 继 续", W / 2, H / 2 + 52);
  }
}

/* 抵达城堡：白屏 + 奖励卡 */
function drawWin(){
  if (state !== "win") return;
  var a = Math.min(1, Math.max(0, (winT - 1.3) / 0.8));
  if (a <= 0) return;
  ctx.fillStyle = "rgba(255,250,240," + a + ")";
  ctx.fillRect(0, 0, W, H);

  ctx.globalAlpha = a;
  ctx.textAlign = "center";

  ctx.fillStyle = "#7a5a3a";
  ctx.font = "bold 38px -apple-system,'PingFang SC',sans-serif";
  ctx.fillText("你 到 了", W / 2, H / 2 - 52);

  ctx.fillStyle = "#9a7a58";
  ctx.font = "16px -apple-system,'PingFang SC',sans-serif";
  ctx.fillText("一路收下 " + coinsGot + " 枚星星", W / 2, H / 2 - 8);

  /* 奖励卡 */
  var cw = 340, ch = 120, cx = W / 2 - cw / 2, cy = H / 2 + 24;
  ctx.fillStyle = "#fff";
  ctx.strokeStyle = "#f0c987";
  ctx.lineWidth = 2;
  roundRect(cx, cy, cw, ch, 14); ctx.fill(); ctx.stroke();

  ctx.fillStyle = "#f0a85c";
  ctx.font = "bold 22px -apple-system,'PingFang SC',sans-serif";
  ctx.fillText(LEVEL.rewardTitle, W / 2, cy + 44);

  ctx.fillStyle = "#b08a68";
  ctx.font = "14px -apple-system,'PingFang SC',sans-serif";
  ctx.fillText(LEVEL.rewardText, W / 2, cy + 78);

  if (winT > 1.5){
    ctx.fillStyle = "rgba(120,90,60,.7)";
    ctx.font = "13px -apple-system,'PingFang SC',sans-serif";
    ctx.fillText("点 一 下 再 跑 一 遍", W / 2, H - 40);
  }
  ctx.globalAlpha = 1;
}

function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function render(){
  ctx.save();
  if (shake > 0){
    ctx.translate((Math.random() - 0.5) * 10 * shake, (Math.random() - 0.5) * 10 * shake);
  }
  bg();
  drawCastle();
  drawCoins();
  drawCheckpoints();
  drawPlats();
  drawGears();
  drawEnemies();
  drawSpikes();
  drawFloor();
  drawPlayer();
  ctx.restore();
  drawHUD();
  drawWin();
}

/* ---------- 主循环 ---------- */
var last = 0;
function loop(ts){
  if (!last) last = ts;
  var dt = Math.min(0.033, (ts - last) / 1000);
  last = ts;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
