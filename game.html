<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>星星小游戏</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#05080f}
  body{font-family:"Songti SC","STSong","Noto Serif SC",serif;color:#e8eefc;
       display:flex;align-items:center;justify-content:center;text-align:center;padding:0 8vw}
  .back{position:fixed;left:18px;top:16px;font-size:13px;letter-spacing:.12em;
    color:#cbd6ee;text-decoration:none;padding:9px 16px;border:1px solid rgba(160,180,220,.22);
    border-radius:999px;background:rgba(10,16,30,.55);backdrop-filter:blur(6px);z-index:6}
  h1{font-size:clamp(24px,3.6vw,40px);font-weight:500;letter-spacing:.18em;
     background:linear-gradient(180deg,#fff6e2,#f0cd92);-webkit-background-clip:text;
     background-clip:text;color:transparent}
  p{margin-top:2vh;font-size:clamp(12px,1.2vw,15px);letter-spacing:.14em;color:#93a1bf;line-height:2}
  .lantern{font-size:34px;margin-bottom:2vh}
  body{animation:in .8s ease both}
  @keyframes in{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<a class="back" href="home.html">← 回夜市</a>
<div>
  <div class="lantern">🏮</div>
  <h1>摊 位 还 在 搭</h1>
  <p>这个摊子的玩法我还没想好<br>过两天来，一定开张</p>
</div>
</body>
</html>
