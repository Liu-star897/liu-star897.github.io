<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>许 个 愿</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#05070f;overflow:hidden}
  body{font-family:"Songti SC","STSong","Noto Serif SC",serif;color:#e8eefc;
       animation:pageIn .9s ease both;user-select:none}
  @keyframes pageIn{from{opacity:0}to{opacity:1}}

  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #box{position:relative;width:min(100vw, calc(100vh * 16 / 9));
       height:min(100vh, calc(100vw * 9 / 16));cursor:pointer}
  #box > img{width:100%;height:100%;display:block;object-fit:contain;pointer-events:none}
  #fx{position:absolute;inset:0;overflow:hidden;pointer-events:none}

  .coin{position:absolute;width:13px;height:13px;border-radius:50%;
        margin:-6.5px 0 0 -6.5px;left:0;top:0;opacity:0;
        background:radial-gradient(circle at 34% 28%,#fff2c0,#e6b451 58%,#8f5c15);
        box-shadow:0 0 12px rgba(255,202,112,.95),0 0 3px rgba(255,255,255,.8);
        transition:transform .58s cubic-bezier(.4,.02,.6,.98),opacity .58s}
  .ripple{position:absolute;border-radius:50%;margin:0;
        border:1.4px solid rgba(255,214,150,.8);
        transform:translate(-50%,-50%) scale(.18);opacity:.95;
        animation:rip 1.7s ease-out forwards}
  @keyframes rip{ to{ transform:translate(-50%,-50%) scale(1); opacity:0 } }
  .heart{position:absolute;transform:translate(-50%,-50%);font-size:23px;line-height:1;
        color:#ff9fc4;text-shadow:0 0 15px rgba(255,110,165,.9),0 0 34px rgba(255,90,150,.45);
        animation:up 2.9s cubic-bezier(.2,.5,.3,1) forwards}
  @keyframes up{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(.35) }
    16%{ opacity:1; transform:translate(-50%,-52%) scale(1.05) }
    72%{ opacity:.92; transform:translate(-50%,-115%) scale(1) }
    100%{ opacity:0; transform:translate(-50%,-168%) scale(1.12) }
  }
  .spark{position:absolute;width:3px;height:3px;border-radius:50%;margin:-1.5px 0 0 -1.5px;
        background:#fff3cf;box-shadow:0 0 8px rgba(255,220,150,.95);
        animation:sp .9s ease-out forwards}
  @keyframes sp{ to{ opacity:0; transform:translate(var(--dx),var(--dy)) scale(.4) } }

  #head{position:absolute;left:0;right:0;top:0;padding:2.4vh 4vw 5vh;text-align:center;
        background:linear-gradient(180deg,rgba(4,7,16,.86),rgba(4,7,16,.34) 62%,rgba(4,7,16,0));
        pointer-events:none;z-index:3}
  #head h1{font-size:clamp(20px,2.9vw,38px);font-weight:500;letter-spacing:.42em;
        text-shadow:0 2px 18px rgba(0,0,0,.8);
        background:linear-gradient(180deg,#fff7e6,#f0cd92);-webkit-background-clip:text;
        background-clip:text;color:transparent}
  #head p{margin-top:1vh;font-size:clamp(10px,1.05vw,13px);letter-spacing:.2em;color:#a9b9d6;
        text-shadow:0 1px 10px rgba(0,0,0,.85)}

  #back{position:fixed;left:max(14px,2.4vw);top:max(14px,2.4vh);z-index:6;
        display:inline-flex;align-items:center;gap:.4em;text-decoration:none;
        font-size:clamp(11px,1.05vw,13px);letter-spacing:.14em;color:#c6d2ea;
        padding:.62em 1.15em;border-radius:999px;
        background:rgba(8,12,24,.55);border:1px solid rgba(180,200,240,.22);
        backdrop-filter:blur(4px);transition:.28s}
  #back:hover{color:#fff;border-color:rgba(214,228,255,.6);background:rgba(20,28,48,.8)}

  #tip{position:absolute;left:50%;bottom:3.2vh;transform:translateX(-50%);
       white-space:nowrap;z-index:3;pointer-events:none;
       font-size:clamp(10px,1.05vw,13px);letter-spacing:.22em;color:#e6d3ac;
       padding:.62em 1.2em;border-radius:999px;
       background:rgba(6,9,18,.58);border:1px solid rgba(255,206,150,.2);
       backdrop-filter:blur(3px);text-shadow:0 1px 10px rgba(0,0,0,.9);
       transition:color .4s,border-color .4s}
</style>
</head>
<body>
<div id="wrap"><div id="box">
  <img src="img/wish.jpg" alt="许愿池">
  <div id="fx"></div>
</div></div>

<div id="head">
  <h1>许 个 愿</h1>
  <p>扔一枚硬币进去，愿望会浮上来</p>
</div>

<a id="back" href="home.html">← 回夜市</a>
<div id="tip">点 一 下 水 面</div>

<script>
(function(){
  var box = document.getElementById("box");
  var fx = document.getElementById("fx");
  var tip = document.getElementById("tip");
  var thrown = 0;

  /* 水面中心（相对舞台的百分比），由图片里井口的位置定的 */
  var CX = 0.518, CY = 0.718;

  function make(cls){
    var el = document.createElement("div");
    el.className = cls;
    return el;
  }

  function splash(cx, cy){
    /* 涟漪 */
    for (var i = 0; i < 3; i++){
      (function(i){
        setTimeout(function(){
          var r = make("ripple");
          var size = 46 + i * 34;
          r.style.width = size + "px";
          r.style.height = size * 0.42 + "px";
          r.style.left = (cx + (Math.random() - 0.5) * 10) + "px";
          r.style.top = (cy + (Math.random() - 0.5) * 5) + "px";
          fx.appendChild(r);
          setTimeout(function(){ if (r.parentNode) r.parentNode.removeChild(r); }, 1800);
        }, i * 190);
      })(i);
    }

    /* 溅起的金色小点 */
    for (var k = 0; k < 9; k++){
      (function(k){
        var s = make("spark");
        s.style.left = cx + "px";
        s.style.top = cy + "px";
        s.style.setProperty("--dx", ((Math.random() - 0.5) * 90) + "px");
        s.style.setProperty("--dy", (-20 - Math.random() * 46) + "px");
        s.style.animationDelay = (Math.random() * 0.16) + "s";
        fx.appendChild(s);
        setTimeout(function(){ if (s.parentNode) s.parentNode.removeChild(s); }, 1300);
      })(k);
    }
  }

  function heart(cx, cy){
    var h = make("heart");
    h.textContent = "♥";
    h.style.left = (cx + (Math.random() - 0.5) * 62) + "px";
    h.style.top = (cy - 6) + "px";
    h.style.fontSize = (19 + Math.random() * 11) + "px";
    h.style.animationDuration = (2.5 + Math.random() * 0.8) + "s";
    fx.appendChild(h);
    setTimeout(function(){ if (h.parentNode) h.parentNode.removeChild(h); }, 3600);
  }

  function throwCoin(px, py){
    var w = box.clientWidth, h = box.clientHeight;
    var cx = w * CX, cy = h * CY;

    var coin = make("coin");
    coin.style.left = px + "px";
    coin.style.top = py + "px";
    fx.appendChild(coin);

    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        coin.style.opacity = "1";
        coin.style.transform = "translate(" + (cx - px) + "px," + (cy - py) + "px) scale(.62)";
      });
    });

    setTimeout(function(){
      if (coin.parentNode) coin.parentNode.removeChild(coin);
      splash(cx, cy);
      setTimeout(function(){
        heart(cx, cy);
        if (thrown === 1) tip.textContent = "愿 望 已 记 下";
        else if (thrown === 6) tip.textContent = "还 可 以 再 来 一 枚";
      }, 130);
    }, 600);

    thrown++;
    if (thrown === 1) tip.textContent = "再 扔 一 枚 也 可 以";
  }

  box.addEventListener("click", function(e){
    var rect = box.getBoundingClientRect();
    throwCoin(e.clientX - rect.left, e.clientY - rect.top);
  });

  box.addEventListener("touchstart", function(e){
    if (e.touches.length !== 1) return;
    var rect = box.getBoundingClientRect();
    var t = e.touches[0];
    throwCoin(t.clientX - rect.left, t.clientY - rect.top);
  }, { passive: true });
})();
</script>
</body>
</html>
