<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>许 个 愿</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#05070f;overflow:hidden}
  body{font-family:"Songti SC","STSong","Noto Serif SC",serif;color:#e8eefc;
       animation:pageIn .9s ease both;user-select:none}
  @keyframes pageIn{from{opacity:0}to{opacity:1}}

  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #box{position:relative;width:min(100vw, calc(100vh * 16 / 9));
       height:min(100vh, calc(100vw * 9 / 16));cursor:pointer}
  #box > img{width:100%;height:100%;display:block;object-fit:contain;pointer-events:none}
  #fx{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  #stage{position:absolute;inset:0;overflow:hidden;pointer-events:none}

  /* 金币 */
  .coin{position:absolute;width:26px;height:26px;border-radius:50%;
        margin:-13px 0 0 -13px;left:0;top:0;opacity:0;
        background:radial-gradient(circle at 34% 28%,#fff6d0,#eec25c 55%,#8f5c15);
        box-shadow:0 0 16px rgba(255,206,120,1),0 0 5px rgba(255,255,255,.9);
        transition:transform .62s cubic-bezier(.4,.02,.6,.98),opacity .62s}
  .coin::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;
        margin:-4.5px 0 0 -4.5px;border-radius:50%;
        border:1.4px solid rgba(150,95,25,.55)}

  /* 涟漪 */
  .ripple{position:absolute;border-radius:50%;margin:0;
        border:2px solid rgba(255,236,196,.95);
        box-shadow:0 0 12px rgba(255,214,150,.7),inset 0 0 10px rgba(255,214,150,.5);
        transform:translate(-50%,-50%) scale(.14);opacity:1;
        animation:rip 1.9s cubic-bezier(.12,.7,.3,1) forwards}
  @keyframes rip{ to{ transform:translate(-50%,-50%) scale(1); opacity:0 } }

  /* 水花：一圈白光 + 飞起的水珠 */
  .flash{position:absolute;border-radius:50%;transform:translate(-50%,-50%) scale(.3);
        background:radial-gradient(circle,rgba(255,246,220,.95),rgba(255,220,160,.5) 45%,rgba(255,210,150,0) 72%);
        animation:fl .5s ease-out forwards}
  @keyframes fl{ to{ opacity:0; transform:translate(-50%,-50%) scale(1.9) } }

  .drop{position:absolute;width:4px;height:4px;border-radius:50%;margin:-2px 0 0 -2px;
        background:#fff8e2;box-shadow:0 0 7px rgba(255,235,190,1);
        animation:dr 1s cubic-bezier(.25,.6,.4,1) forwards}
  @keyframes dr{
    0%{ opacity:1; transform:translate(0,0) scale(1) }
    52%{ opacity:1; transform:translate(var(--dx),var(--dy)) scale(.95) }
    100%{ opacity:0; transform:translate(calc(var(--dx) * 1.55), 16px) scale(.6) }
  }

  /* 爱心 */
  .heart{position:absolute;transform:translate(-50%,-50%);line-height:1;
        --wx:0px; --hy:210px;
        color:#ff9fc4;text-shadow:0 0 15px rgba(255,110,165,.95),0 0 36px rgba(255,90,150,.5);
        animation:up 2.9s cubic-bezier(.2,.5,.3,1) forwards}
  @keyframes up{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(.35) }
    15%{ opacity:1; transform:translate(calc(-50% + var(--wx) * .18), calc(-50% - var(--hy) * .12)) scale(1.06) }
    68%{ opacity:.94; transform:translate(calc(-50% + var(--wx) * .78), calc(-50% - var(--hy) * .74)) scale(1) }
    100%{ opacity:0; transform:translate(calc(-50% + var(--wx)), calc(-50% - var(--hy))) scale(1.12) }
  }

  /* 井口的光晕（攒满时用） */
  .glow{position:absolute;border-radius:50%;transform:translate(-50%,-50%);
        background:radial-gradient(circle,rgba(255,244,214,.9),rgba(255,206,150,.34) 42%,rgba(255,190,120,0) 70%);
        animation:gl 2.4s ease-out forwards}
  @keyframes gl{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(.4) }
    22%{ opacity:1; transform:translate(-50%,-50%) scale(1) }
    100%{ opacity:0; transform:translate(-50%,-50%) scale(1.5) }
  }

  #head{position:absolute;left:0;right:0;top:0;padding:2.4vh 4vw 5vh;text-align:center;
        background:linear-gradient(180deg,rgba(4,7,16,.86),rgba(4,7,16,.34) 62%,rgba(4,7,16,0));
        pointer-events:none;z-index:3}
  #head h1{font-size:clamp(20px,2.9vw,38px);font-weight:500;letter-spacing:.42em;
        text-shadow:0 2px 18px rgba(0,0,0,.8);
        background:linear-gradient(180deg,#fff7e6,#f0cd92);-webkit-background-clip:text;
        background-clip:text;color:transparent}
  #head p{margin-top:1vh;font-size:clamp(10px,1.05vw,13px);letter-spacing:.2em;color:#a9b9d6;
        text-shadow:0 1px 10px rgba(0,0,0,.85)}

  #back{position:fixed;left:max(14px,2.4vw);top:max(14px,2.4vh);z-index:6;
        display:inline-flex;align-items:center;gap:.4em;text-decoration:none;
        font-size:clamp(11px,1.05vw,13px);letter-spacing:.14em;color:#c6d2ea;
        padding:.62em 1.15em;border-radius:999px;
        background:rgba(8,12,24,.55);border:1px solid rgba(180,200,240,.22);
        backdrop-filter:blur(4px);transition:.28s}
  #back:hover{color:#fff;border-color:rgba(214,228,255,.6);background:rgba(20,28,48,.8)}

  #tip{position:absolute;left:50%;bottom:3.2vh;transform:translateX(-50%);
       display:flex;align-items:center;gap:.85em;white-space:nowrap;z-index:3;
       pointer-events:none;font-size:clamp(10px,1.05vw,13px);letter-spacing:.2em;
       color:#e6d3ac;padding:.62em 1.25em;border-radius:999px;
       background:rgba(6,9,18,.58);border:1px solid rgba(255,206,150,.2);
       backdrop-filter:blur(3px);text-shadow:0 1px 10px rgba(0,0,0,.9);
       transition:color .4s,border-color .4s}
  /* 井底沉着的硬币 */
  .bcoin{position:absolute;width:15px;height:15px;border-radius:50%;
        transform:translate(-50%,-50%) scale(.3);opacity:0;
        background:radial-gradient(circle at 36% 30%,#fff0bc,#dcab48 60%,#7d4f12);
        box-shadow:0 0 9px rgba(255,200,110,.8);
        transition:opacity .55s ease,transform .55s cubic-bezier(.2,1.4,.4,1)}
  .bcoin.on{opacity:.92;transform:translate(-50%,-50%) scale(1)}

  /* 廊架上的星灯 / 灯笼，投一枚亮一个 */
  .lan{position:absolute;width:58px;height:58px;border-radius:50%;
      transform:translate(-50%,-50%) scale(.7);opacity:0;pointer-events:none;
      background:radial-gradient(circle,rgba(255,242,200,.95),rgba(255,208,140,.42) 46%,rgba(255,190,110,0) 74%);
      transition:opacity .9s ease,transform .9s ease;filter:blur(1px)}
  .lan.on{opacity:1;transform:translate(-50%,-50%) scale(1);
      animation:lanPulse 3s ease-in-out infinite}
  @keyframes lanPulse{
    0%,100%{ transform:translate(-50%,-50%) scale(1) }
    50%{ transform:translate(-50%,-50%) scale(1.14) }
  }

  /* 水里的月光倒影 */
  #moon{position:absolute;width:15%;height:3.2%;border-radius:50%;
      transform:translate(-50%,-50%);pointer-events:none;
      background:radial-gradient(ellipse,rgba(226,240,255,.46),rgba(198,218,255,.14) 54%,rgba(190,210,255,0) 78%);
      filter:blur(2.5px);transition:transform .2s ease;
      animation:moonBreath 6.5s ease-in-out infinite}
  @keyframes moonBreath{
    0%,100%{ opacity:.62 }
    50%{ opacity:.9 }
  }

  #dots{display:flex;gap:5px}
  .dot{width:5px;height:5px;border-radius:50%;background:rgba(230,211,172,.26);
       transition:background .4s,box-shadow .4s,transform .3s}
  .dot.on{background:#ffd98a;box-shadow:0 0 9px rgba(255,205,120,.95);transform:scale(1.15)}
</style>
</head>
<body>
<div id="wrap"><div id="box">
  <img src="img/wish.jpg" alt="许愿池">
  <div id="fx"></div>
  <div id="stage"></div>
</div></div>

<div id="head">
  <h1>许 个 愿</h1>
  <p>扔五枚硬币进去</p>
</div>

<a id="back" href="home.html">← 回夜市</a>
<div id="tip"><span id="tiptext">点 一 下 水 面</span><span id="dots"></span></div>

<script>
(function(){
  var box = document.getElementById("box");
  var fx = document.getElementById("fx");
  var tip = document.getElementById("tip");
  var tipText = document.getElementById("tiptext");
  var dotsEl = document.getElementById("dots");

  var NEED = 5;
  var thrown = 0;
  var busy = false;

  /* 廊架上的五个暖光点（三颗星灯 + 两盏地灯） */
  var LANT = [[33.0, 49.3], [39.8, 49.6], [58.4, 48.8], [28.5, 90.2], [74.8, 90.4]];
  /* 沉在井底的硬币位置 */
  var BCOIN = [[46.2, 71.4], [54.6, 72.4], [49.0, 73.2], [57.0, 70.9], [51.0, 70.3]];

  var stage = document.getElementById("stage");
  var lantEls = [], coinEls = [];

  LANT.forEach(function(p){
    var el = document.createElement("span");
    el.className = "lan";
    el.style.left = p[0] + "%";
    el.style.top = p[1] + "%";
    stage.appendChild(el);
    lantEls.push(el);
  });

  var moonEl = document.createElement("div");
  moonEl.id = "moon";
  moonEl.style.left = "51.8%";
  moonEl.style.top = "71.1%";
  stage.appendChild(moonEl);

  BCOIN.forEach(function(p){
    var el = document.createElement("span");
    el.className = "bcoin";
    el.style.left = p[0] + "%";
    el.style.top = p[1] + "%";
    stage.appendChild(el);
    coinEls.push(el);
  });

  function wobbleMoon(){
    var seq = [
      ["translate(-50%,-50%) scale(1.4,.82)", 0],
      ["translate(-50%,-50%) scale(.9,1.08)", 170],
      ["translate(-50%,-50%) scale(1.08,.95)", 340],
      ["translate(-50%,-50%) scale(1)", 540]
    ];
    seq.forEach(function(s){
      setTimeout(function(){ moonEl.style.transform = s[0]; }, s[1]);
    });
  }

  function lightUp(n){
    if (lantEls[n - 1]) lantEls[n - 1].classList.add("on");
    if (coinEls[n - 1]) coinEls[n - 1].classList.add("on");
    wobbleMoon();
  }

  function resetLamps(){
    lantEls.forEach(function(el){ el.classList.remove("on"); });
    coinEls.forEach(function(el){ el.classList.remove("on"); });
  }

  /* 水面中心（相对舞台的百分比） */
  var CX = 0.518, CY = 0.718;

  /* 五个小圆点 */
  var dots = [];
  for (var i = 0; i < NEED; i++){
    var d = document.createElement("span");
    d.className = "dot";
    dotsEl.appendChild(d);
    dots.push(d);
  }

  function make(cls){
    var el = document.createElement("div");
    el.className = cls;
    return el;
  }

  /* ---------- 声音：现场合成的落水声 ---------- */
  var actx = null;
  function audio(){
    if (!actx){
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    }
    if (actx.state === "suspended"){ try { actx.resume(); } catch (e) {} }
    return actx;
  }

  function splashSound(strong){
    var a = audio();
    if (!a) return;
    var t = a.currentTime;

    var o = a.createOscillator(), g = a.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(strong ? 300 : 430, t);
    o.frequency.exponentialRampToValueAtTime(strong ? 90 : 150, t + (strong ? 0.3 : 0.19));
    g.gain.setValueAtTime(strong ? 0.3 : 0.2, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + (strong ? 0.42 : 0.3));
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + 0.45);

    var len = Math.floor(a.sampleRate * (strong ? 0.42 : 0.26));
    var buf = a.createBuffer(1, len, a.sampleRate);
    var ch = buf.getChannelData(0);
    for (var n = 0; n < len; n++){
      ch[n] = (Math.random() * 2 - 1) * Math.pow(1 - n / len, 2.6);
    }
    var src = a.createBufferSource(); src.buffer = buf;
    var bp = a.createBiquadFilter();
    bp.type = "bandpass"; bp.frequency.value = strong ? 2100 : 2700; bp.Q.value = 1.1;
    var g2 = a.createGain();
    g2.gain.setValueAtTime(strong ? 0.17 : 0.1, t + 0.015);
    g2.gain.exponentialRampToValueAtTime(0.001, t + (strong ? 0.4 : 0.24));
    src.connect(bp); bp.connect(g2); g2.connect(a.destination);
    src.start(t + 0.015);
  }

  /* 攒满时的一小段上扬音 */
  function chimeSound(){
    var a = audio();
    if (!a) return;
    var t = a.currentTime;
    [523.25, 659.25, 783.99, 1046.5].forEach(function(f, i){
      var o = a.createOscillator(), g = a.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(f, t + i * 0.11);
      g.gain.setValueAtTime(0, t + i * 0.11);
      g.gain.linearRampToValueAtTime(0.075, t + i * 0.11 + 0.03);
      g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.11 + 0.9);
      o.connect(g); g.connect(a.destination);
      o.start(t + i * 0.11); o.stop(t + i * 0.11 + 1);
    });
  }

  /* ---------- 画面 ---------- */
  function splash(cx, cy, strong){
    var flash = make("flash");
    var fz = strong ? 150 : 92;
    flash.style.width = fz + "px";
    flash.style.height = fz * 0.44 + "px";
    flash.style.left = cx + "px";
    flash.style.top = cy + "px";
    fx.appendChild(flash);
    setTimeout(function(){ if (flash.parentNode) flash.parentNode.removeChild(flash); }, 600);

    var rings = strong ? 4 : 3;
    for (var i = 0; i < rings; i++){
      (function(i){
        setTimeout(function(){
          var r = make("ripple");
          var size = (strong ? 70 : 54) + i * (strong ? 52 : 40);
          r.style.width = size + "px";
          r.style.height = size * 0.42 + "px";
          r.style.left = (cx + (Math.random() - 0.5) * 8) + "px";
          r.style.top = (cy + (Math.random() - 0.5) * 4) + "px";
          fx.appendChild(r);
          setTimeout(function(){ if (r.parentNode) r.parentNode.removeChild(r); }, 2000);
        }, i * 170);
      })(i);
    }

    var drops = strong ? 18 : 12;
    for (var k = 0; k < drops; k++){
      (function(k){
        var s = make("drop");
        var spread = strong ? 105 : 74;
        s.style.left = cx + "px";
        s.style.top = cy + "px";
        s.style.setProperty("--dx", ((Math.random() - 0.5) * spread) + "px");
        s.style.setProperty("--dy", (-16 - Math.random() * (strong ? 78 : 52)) + "px");
        s.style.animationDelay = (Math.random() * 0.1) + "s";
        var sz = 2.6 + Math.random() * 2.6;
        s.style.width = sz + "px"; s.style.height = sz + "px";
        fx.appendChild(s);
        setTimeout(function(){ if (s.parentNode) s.parentNode.removeChild(s); }, 1200);
      })(k);
    }
  }

  function heartAt(cx, cy, delay, size, drift, rise){
    setTimeout(function(){
      var h = make("heart");
      h.textContent = "♥";
      h.style.left = (cx + (Math.random() - 0.5) * 150) + "px";
      h.style.top = (cy + (Math.random() - 0.5) * 16) + "px";
      h.style.fontSize = size + "px";
      h.style.setProperty("--wx", drift + "px");
      h.style.setProperty("--hy", rise + "px");
      h.style.animationDuration = (2.8 + Math.random() * 1.2) + "s";
      if (Math.random() < 0.3) h.style.color = "#ffb8d8";
      if (Math.random() < 0.18) h.style.color = "#ffd6a0";
      fx.appendChild(h);
      setTimeout(function(){ if (h.parentNode) h.parentNode.removeChild(h); }, 4600);
    }, delay);
  }

  /* 五枚攒满：井口亮起来，一段爱心升上来 */
  function bigWish(cx, cy){
    var glow = make("glow");
    glow.style.width = "270px";
    glow.style.height = "150px";
    glow.style.left = cx + "px";
    glow.style.top = cy + "px";
    fx.appendChild(glow);
    setTimeout(function(){ if (glow.parentNode) glow.parentNode.removeChild(glow); }, 2600);

    for (var i = 0; i < 18; i++){
      heartAt(cx, cy, 100 + i * 95, 16 + Math.random() * 17,
              (Math.random() - 0.5) * 190, 150 + Math.random() * 160);
    }
    for (var k = 0; k < 22; k++){
      (function(k){
        setTimeout(function(){
          var s = make("drop");
          s.style.left = (cx + (Math.random() - 0.5) * 120) + "px";
          s.style.top = cy + "px";
          s.style.setProperty("--dx", ((Math.random() - 0.5) * 60) + "px");
          s.style.setProperty("--dy", (-40 - Math.random() * 90) + "px");
          s.style.background = "rgba(255,232,180,.95)";
          fx.appendChild(s);
          setTimeout(function(){ if (s.parentNode) s.parentNode.removeChild(s); }, 1300);
        }, k * 60);
      })(k);
    }

    chimeSound();
  }

  function updateTip(){
    if (thrown === 0){ tipText.textContent = "点 一 下 水 面"; }
    else if (thrown >= NEED){ tipText.textContent = "愿 望 已 收 下"; }
    else { tipText.textContent = "还 差 " + (NEED - thrown) + " 枚"; }
    for (var i = 0; i < NEED; i++){
      if (i < thrown) dots[i].classList.add("on");
      else dots[i].classList.remove("on");
    }
  }

  function throwCoin(px, py){
    if (busy) return;
    var w = box.clientWidth, h = box.clientHeight;
    var cx = w * CX, cy = h * CY;

    var coin = make("coin");
    coin.style.left = px + "px";
    coin.style.top = py + "px";
    fx.appendChild(coin);

    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        coin.style.opacity = "1";
        coin.style.transform = "translate(" + (cx - px) + "px," + (cy - py) + "px) scale(.5) rotate(220deg)";
      });
    });

    setTimeout(function(){
      if (coin.parentNode) coin.parentNode.removeChild(coin);

      thrown++;
      if (thrown > NEED) thrown = NEED;
      updateTip();
      lightUp(thrown);

      var last = (thrown >= NEED);
      splash(cx, cy, last);
      splashSound(last);

      if (last){
        busy = true;
        bigWish(cx, cy);
        setTimeout(function(){
          thrown = 0;
          busy = false;
          updateTip();
          resetLamps();
          tipText.textContent = "可 以 再 许 一 次";
          setTimeout(function(){
            if (!busy && thrown === 0) tipText.textContent = "点 一 下 水 面";
          }, 3400);
        }, 3800);
      }
    }, 660);
  }

  box.addEventListener("click", function(e){
    var rect = box.getBoundingClientRect();
    throwCoin(e.clientX - rect.left, e.clientY - rect.top);
  });

  box.addEventListener("touchstart", function(e){
    if (e.touches.length !== 1) return;
    var rect = box.getBoundingClientRect();
    var t = e.touches[0];
    throwCoin(t.clientX - rect.left, t.clientY - rect.top);
  }, { passive: true });

  updateTip();
})();
</script>
</body>
</html>
